<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Profilis</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Profilis</h1>

        <div class="card">
            <h2>Keisti asmeninius duomenis</h2>

            <form id="profileForm">
                <label>Vardas Pavardė</label>
                <input type="text" id="fullname" disabled class="readonly-input">

                <label>Prisijungimo vardas</label>
                <input type="text" name="username" id="username" required>

                <label>El. paštas</label>
                <input type="text" name="email" id="email" required>

                <label>Naujas slaptažodis (palikite tuščią, jei nekeičiate)</label>
                <input type="password" name="password" id="password" placeholder="Naujas slaptažodis...">

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Išsaugoti</button>
            </form>
            <br>
            <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
        </div>
    </div>

    <script>
        let currentUser = {};

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();

                document.getElementById('fullname').value = `${currentUser.name} ${currentUser.surname}`;
                document.getElementById('username').value = currentUser.username || '';
                document.getElementById('email').value = currentUser.email || '';
            } catch (err) {
                window.location.href = '/';
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = Object.fromEntries(new FormData(this).entries());
            try {
                const res = await fetch(`${API_URL}/api/profile/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (res.ok) {
                    showToast("Profilio duomenys sėkmingai atnaujinti!", "success");
                    document.getElementById('password').value = '';
                } else {
                    showToast(result.message || "Klaida išsaugant pakeitimus.", "error");
                }
            } catch (err) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        });

        window.onload = loadProfile;
    </script>
</body>
</html>
