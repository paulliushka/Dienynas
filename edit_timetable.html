<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Tvarkaraščio redagavimas</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Tvarkaraščio įrašo redagavimas</h1>

        <div class="card">
            <form id="editTimetableForm" onsubmit="handleUpdateTimetable(event)">
                <div class="form-group">
                    <label>Grupė</label>
                    <select id="groupSelect" required></select>
                </div>
                <div class="form-group">
                    <label>Savaitės diena</label>
                    <select id="daySelect" required>
                        <option value="Pirmadienis">Pirmadienis</option>
                        <option value="Antradienis">Antradienis</option>
                        <option value="Trečiadienis">Trečiadienis</option>
                        <option value="Ketvirtadienis">Ketvirtadienis</option>
                        <option value="Penktadienis">Penktadienis</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Pamokos eiliškumas / Laikas</label>
                    <input type="text" id="lessonOrder" placeholder="pvz. 1 pamoka" required>
                </div>
                <div class="form-group">
                    <label>Kabinetas</label>
                    <input type="text" id="classroom" placeholder="pvz. 214 kab.">
                </div>
                <div class="form-group">
                    <label>Mokytojas (Pavadavimui)</label>
                    <select id="teacherSelect" required></select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Galioja nuo (Data)</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label>Galioja iki (Data)</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn btn-primary">Atnaujinti įrašą</button>
                    <button type="button" class="logout-btn" onclick="deleteTimetable()">Pašalinti pamoką</button>
                </div>
            </form>
        </div>

        <a href="timetables" class="btn-back">← Atgal į tvarkaraštį</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const timetableId = urlParams.get('timetable_id');

        async function init() {
            if (!timetableId) {
                showToast('Nenurodytas tvarkaraščio ID!', 'error');
                return;
            }

            try {
                const [resGroups, resTeachers, resTt] = await Promise.all([
                    fetch(`${API_URL}/api/groups`, { credentials: 'include' }),
                    fetch(`${API_URL}/api/teachers`, { credentials: 'include' }),
                    fetch(`${API_URL}/api/timetables`, { credentials: 'include' })
                ]);

                const groups = await resGroups.json();
                const teachers = await resTeachers.json();
                const timetables = await resTt.json();

                const gSelect = document.getElementById('groupSelect');
                groups.forEach(g => {
                    gSelect.innerHTML += `<option value="${g.group_id}">${g.group_name} (${g.class})</option>`;
                });

                const tSelect = document.getElementById('teacherSelect');
                teachers.forEach(t => {
                    tSelect.innerHTML += `<option value="${t.user_id}">${t.name} ${t.surname}</option>`;
                });

                // Surandame konkretų redaguojamą įrašą
                const currentItem = timetables.find(t => String(t.timetable_id) === String(timetableId));
                if (currentItem) {
                    gSelect.value = currentItem.group_id;
                    document.getElementById('daySelect').value = currentItem.day_of_week;
                    document.getElementById('lessonOrder').value = currentItem.lesson_order;
                    document.getElementById('classroom').value = currentItem.classroom || '';
                    if (currentItem.teacher_id) {
                        tSelect.value = currentItem.teacher_id;
                    }
                    document.getElementById('startDate').value = currentItem.start_date || '';
                    document.getElementById('endDate').value = currentItem.end_date || '';
                } else {
                    showToast('Tvarkaraščio įrašas nerastas.', 'error');
                }
            } catch (err) {
                showToast('Klaida užkraunant duomenis.', 'error');
            }
        }

        async function handleUpdateTimetable(e) {
            e.preventDefault();
            const data = {
                group_id: document.getElementById('groupSelect').value,
                day_of_week: document.getElementById('daySelect').value,
                lesson_order: document.getElementById('lessonOrder').value,
                classroom: document.getElementById('classroom').value,
                teacher_id: document.getElementById('teacherSelect').value,
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value
            };

            try {
                const res = await fetch(`${API_URL}/api/timetables/edit/${timetableId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showToast('Sėkmingai atnaujinta!', 'success');
                    setTimeout(() => window.location.href = 'timetable', 1000);
                } else {
                    showToast('Klaida išsaugant.', 'error');
                }
            } catch (err) {
                showToast('Tinklo klaida.', 'error');
            }
        }

        async function deleteTimetable() {
            if (!confirm('Ar tikrai norite ištrinti šį tvarkaraščio įrašą?')) return;
            try {
                await fetch(`${API_URL}/api/timetables/delete/${timetableId}`, { credentials: 'include' });
                showToast('Įrašas pašalintas', 'success');
                setTimeout(() => window.location.href = 'timetable', 800);
            } catch (err) {
                showToast('Nepavyko pašalinti.', 'error');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
