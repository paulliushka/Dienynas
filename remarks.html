<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pagyrimai ir pastabos</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pagyrimai ir pastabos</h1>

        <div class="card d-none" id="addRemarkCard">
            <h2>Įrašyti pagyrimą arba pastabą</h2>

            <form id="addRemarkForm">
                <label>Grupė</label>
                <select name="group_id" id="group_select" onchange="loadStudentsByGroup()" required>
                    <option value="">-- Pasirinkite grupę --</option>
                </select>

                <label>Mokinys</label>
                <select name="student_id" id="student_select" required disabled>
                    <option value="">-- Pirmiausia pasirinkite grupę --</option>
                </select>

                <label>Tipas</label>
                <select name="type" required>
                    <option value="praise">Pagyrimas</option>
                    <option value="reprimand">Pastaba</option>
                </select>

                <label>Turinys</label>
                <textarea name="content" rows="3" placeholder="Turinys..." required></textarea>

                <label>Data (YYYY-MM-DD)</label>
                <input type="text" name="date" id="remark_date" class="calendar-input" placeholder="YYYY-MM-DD" required>

                <button type="submit" class="btn btn-primary mt-15">Įrašyti</button>
            </form>
        </div>

        <div class="card">
            <h2>Įrašų sąrašas</h2>

            <div class="grid-2-cols mb-12">
                <div>
                    <label class="mt-0">Filtruoti pagal tipą:</label>
                    <select id="filter_type" onchange="filterRemarks()">
                        <option value="">-- Visi tipai --</option>
                        <option value="praise">Pagyrimai</option>
                        <option value="reprimand">Pastabos</option>
                    </select>
                </div>
                <div>
                    <label class="mt-0">Paieška (mokinys / turinys / mokytojas):</label>
                    <input type="text" id="filter_search" placeholder="Įveskite paieškos žodį..." oninput="filterRemarks()">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="remarksTableHeader">
                            <th>Mokinys</th>
                            <th>Grupė</th>
                            <th>Tipas</th>
                            <th>Turinys</th>
                            <th>Data</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="remarksTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};
        let allRemarks = [];

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();
                await initPage();
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function initPage() {
            if (currentUser.role === 'teacher') {
                document.getElementById('addRemarkCard').classList.remove('d-none');
                setDefaultDate();
                await loadTeacherGroups();
            }

            await loadRemarks();
            if (typeof initCalendarPickers === 'function') initCalendarPickers();
            if (typeof initCustomSelects === 'function') initCustomSelects();
        }

        function setDefaultDate() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateInput = document.getElementById('remark_date');
            if (dateInput) {
                dateInput.value = `${now.getFullYear()}-${month}-${day}`;
                dateInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        async function loadTeacherGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups?only_mine=true`, { credentials: 'include' });
                const groups = await response.json();
                const select = document.getElementById('group_select');
                select.innerHTML = '<option value="">-- Pasirinkite grupę --</option>';

                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.group_id;
                    opt.textContent = `${g.group_name} (${g.class} klasė)`;
                    select.appendChild(opt);
                });
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                showToast('Nepavyko užkrauti grupių.', 'error');
            }
        }

        async function loadStudentsByGroup() {
            const groupId = document.getElementById('group_select').value;
            const select = document.getElementById('student_select');

            if (!groupId) {
                select.innerHTML = '<option value="">-- Pirmiausia pasirinkite grupę --</option>';
                select.disabled = true;
                select.dispatchEvent(new Event('change', { bubbles: true }));
                return;
            }

            try {
                const response = await fetch(`${API_URL}/get_students_by_group/${groupId}`, { credentials: 'include' });
                const students = await response.json();

                select.innerHTML = '<option value="">-- Pasirinkite mokinį --</option>';
                students.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.user_id;
                    opt.textContent = `${s.name} ${s.surname}`;
                    select.appendChild(opt);
                });
                select.disabled = false;
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                showToast('Nepavyko užkrauti mokinių.', 'error');
            }
        }

        async function loadRemarks() {
            try {
                const response = await fetch(`${API_URL}/api/remarks`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                allRemarks = await response.json();
                renderRemarks(allRemarks);
            } catch (error) {
                showToast('Nepavyko užkrauti įrašų sąrašo.', 'error');
            }
        }

        function renderRemarks(remarks) {
            const theader = document.getElementById('remarksTableHeader');
            const tbody = document.getElementById('remarksTableBody');
            tbody.innerHTML = '';

            const showActions = currentUser.role === 'teacher';

            if (showActions && !document.getElementById('actionsHeader')) {
                const th = document.createElement('th');
                th.id = 'actionsHeader';
                th.textContent = 'Veiksmai';
                theader.appendChild(th);
            }

            if (!Array.isArray(remarks) || remarks.length === 0) {
                const colSpan = showActions ? 7 : 6;
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-row">Įrašų nerasta.</td></tr>`;
                return;
            }

            remarks.forEach(r => {
                const tr = document.createElement('tr');
                const isGroupTeacher = r.group_teachers && r.group_teachers.includes(currentUser.user_id);

                const typeBadge = r.type === 'praise' 
                    ? '<span style="color: #4cd964; font-weight: bold;">Pagyrimas</span>' 
                    : '<span style="color: #ff3b30; font-weight: bold;">Pastaba</span>';

                let rowHtml = `
                    <td data-label="Mokinys"><strong>${r.student}</strong></td>
                    <td data-label="Grupė">${r.group_display}</td>
                    <td data-label="Tipas">${typeBadge}</td>
                    <td data-label="Turinys">${r.content}</td>
                    <td data-label="Data">${r.date}</td>
                    <td data-label="Mokytojas">${r.teacher || '-'}</td>
                `;

                if (showActions) {
                    const actionsTd = isGroupTeacher 
                        ? `<a href="editing/edit_remark?id=${r.remark_id}">Redaguoti</a> | <a href="javascript:void(0);" onclick="deleteRemark(${r.remark_id}); return false;">Ištrinti</a>`
                        : '<span style="color: var(--text-muted);">Neturite teisių</span>';
                    
                    rowHtml += `<td data-label="Veiksmai">${actionsTd}</td>`;
                }

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function filterRemarks() {
            const filterType = document.getElementById('filter_type').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allRemarks.filter(r => {
                let match = true;
                if (filterType && r.type !== filterType) match = false;
                if (searchText) {
                    const combined = `${r.student} ${r.group_display} ${r.content} ${r.teacher}`.toLowerCase();
                    if (!combined.includes(searchText)) match = false;
                }
                return match;
            });

            renderRemarks(filtered);
        }

        document.addEventListener('submit', async function(e) {
            if (e.target && e.target.id === 'addRemarkForm') {
                e.preventDefault();
                const formData = new FormData(e.target);
                const payload = {
                    student_id: formData.get('student_id'),
                    group_id: formData.get('group_id'),
                    type: formData.get('type'),
                    content: formData.get('content'),
                    date: formData.get('date')
                };

                try {
                    const response = await fetch(`${API_URL}/api/remarks/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        e.target.reset();
                        setDefaultDate();
                        document.getElementById('student_select').disabled = true;
                        showToast("Įrašas sėkmingai išsaugotas!", "success");
                        loadRemarks();
                    } else {
                        const errResult = await response.json();
                        showToast(errResult.message || "Nepavyko įrašyti.", "error");
                    }
                } catch (error) {
                    showToast("Nepavyko prisijungti prie serverio.", "error");
                }
            }
        });

        async function deleteRemark(remarkId) {
            if (!confirm('Ar tikrai norite ištrinti šį įrašą?')) return;
            try {
                const response = await fetch(`${API_URL}/api/remarks/delete/${remarkId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    showToast("Įrašas ištrintas.", "success");
                    loadRemarks();
                } else {
                    showToast("Nepavyko ištrinti įrašo.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        }

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
