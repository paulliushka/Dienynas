<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Redaguoti vartotojo duomenis</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Redaguoti vartotojo duomenis</h2>
            
            <form id="editUserForm">
                <label>Prisijungimo vardas</label>
                <input type="text" name="username" id="username" required>

                <label>Vardas</label>
                <input type="text" name="name" id="name" required>

                <label>Pavardė</label>
                <input type="text" name="surname" id="surname" required>

                <label>Slaptažodis (palikite tuščią, jei nekeičiate)</label>
                <input type="password" name="password" id="password" placeholder="Naujas slaptažodis">

                <label>Rolė</label>
                <select name="role" id="role" required onchange="toggleClassField()">
                    <option value="teacher">Mokytojas</option>
                    <option value="student">Mokinys</option>
                    <option value="administrator">Administratorius</option>
                </select>

                <label>Klasė (tik mokiniams)</label>
                <input type="text" name="class" id="class">

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Išsaugoti pakeitimus</button>
            </form>
            <br>
            <a href="administration" class="btn-back">Atšaukti ir grįžti</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (!userId) {
            alert("Nenurodytas vartotojo ID.");
            window.location.href = 'administration';
        }

        function toggleClassField() {
            const role = document.getElementById('role').value;
            const classField = document.getElementById('class');
            if (role === 'student') {
                classField.disabled = false;
                classField.required = true;
            } else {
                classField.disabled = true;
                classField.required = false;
                classField.value = "";
            }
        }

        async function loadUser() {
            try {
                const response = await fetch(`${API_URL}/api/users/${userId}`);
                if (!response.ok) {
                    alert("Vartotojas nerastas.");
                    window.location.href = 'administration';
                    return;
                }

                const user = await response.json();

                document.getElementById('username').value = user.username || '';
                document.getElementById('name').value = user.name || '';
                document.getElementById('surname').value = user.surname || '';
                document.getElementById('role').value = user.role || 'student';
                document.getElementById('class').value = user.class || '';

                toggleClassField();
            } catch (error) {
                console.error("Klaida užkraunant vartotoją:", error);
            }
        }

        document.getElementById('editUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`${API_URL}/api/users/edit/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = 'administration';
                } else {
                    const result = await response.json();
                    alert(result.message || "Klaida išsaugant vartotoją.");
                }
            } catch (error) {
                alert("Nepavyko prisijungti prie serverio.");
            }
        });

        window.onload = loadUser;
    </script>
</body>
</html>
