<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Redaguoti vartotoją</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Vartotojai</h1>

        <div class="card">
            <h2>Redaguoti vartotojo duomenis</h2>

            <form id="editUserForm">
                <label>Vardas</label>
                <input type="text" name="name" id="name" required>

                <label>Pavardė</label>
                <input type="text" name="surname" id="surname" required>

                <label>Rolė</label>
                <select name="role" id="role" required onchange="toggleClassField()">
                    <option value="teacher">Mokytojas</option>
                    <option value="student">Mokinys</option>
                    <option value="administrator">Administratorius</option>
                </select>

                <label>Klasė (tik mokiniams)</label>
                <input type="text" name="class" id="class">

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Išsaugoti</button>
            </form>
            <br>
            <a href="users" class="btn-back">← Grįžti atgal</a>
        </div>
    </div>

    <script src="select.js"></script>
    <script>
        let currentUser = {};
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');
        if (!userId) { window.location.href = 'users'; }

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                currentUser = await response.json();
                if (currentUser.role !== 'administrator') {
                    window.location.href = 'dashboard';
                    return;
                }
                await loadUser();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function toggleClassField() {
            const role = document.getElementById('role').value;
            const classField = document.getElementById('class');
            if (role === 'student') { 
                classField.disabled = false; 
                classField.required = true; 
            } else { 
                classField.disabled = true; 
                classField.required = false; 
                classField.value = ""; 
            }
        }

        async function loadUser() {
            try {
                const response = await fetch(`${API_URL}/api/users/${userId}`, { credentials: 'include' });
                if (!response.ok) { window.location.href = 'users'; return; }
                const user = await response.json();
                
                document.getElementById('name').value = user.name || '';
                document.getElementById('surname').value = user.surname || '';
                
                const roleSelect = document.getElementById('role');
                roleSelect.value = user.role || 'student';
                roleSelect.dispatchEvent(new Event('change', { bubbles: true }));

                document.getElementById('class').value = user.class || '';
                
                toggleClassField();
                initCustomSelects();
            } catch (error) { 
                showToast("Klaida kraunant vartotojo duomenis.", "error");
            }
        }

        document.getElementById('editUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = Object.fromEntries(new FormData(this).entries());
            try {
                const res = await fetch(`${API_URL}/api/users/edit/${userId}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    credentials: 'include', 
                    body: JSON.stringify(data)
                });
                
                if (res.ok) { 
                    window.location.href = 'users'; 
                } else { 
                    const r = await res.json(); 
                    showToast(r.message || "Klaida išsaugant pakeitimus.", "error"); 
                }
            } catch (err) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        });

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
