<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Redaguoti vartotoją</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        if (!currentUser.user_id || currentUser.role !== 'administrator') { 
            window.location.href = 'dashboard'; 
        }
    </script>
    <div class="container">
        <h1>Vartotojų valdymas</h1>

        <div class="card">
            <h2>Redaguoti vartotojo duomenis</h2>
            <div id="errorBox" class="error-message"></div>

            <form id="editUserForm">
                <label>Vardas</label>
                <input type="text" name="name" id="name" required>

                <label>Pavardė</label>
                <input type="text" name="surname" id="surname" required>

                <label>Rolė</label>
                <select name="role" id="role" required onchange="toggleClassField()">
                    <option value="teacher">Mokytojas</option>
                    <option value="student">Mokinys</option>
                    <option value="administrator">Administratorius</option>
                </select>

                <label>Klasė (tik mokiniams)</label>
                <input type="text" name="class" id="class">

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Išsaugoti pakeitimus</button>
            </form>
            <br>
            <a href="administration" class="btn-back">← Atšaukti ir grįžti</a>
        </div>
    </div>

    <script src="select.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');
        if (!userId) { window.location.href = 'administration'; }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            if (box) {
                box.textContent = msg;
                box.style.display = 'block';
            }
        }

        function toggleClassField() {
            const role = document.getElementById('role').value;
            const classField = document.getElementById('class');
            if (role === 'student') { 
                classField.disabled = false; 
                classField.required = true; 
            } else { 
                classField.disabled = true; 
                classField.required = false; 
                classField.value = ""; 
            }
        }

        async function loadUser() {
            try {
                const response = await fetch(`${API_URL}/api/users/${userId}`, { credentials: 'include' });
                if (!response.ok) { window.location.href = 'administration'; return; }
                const user = await response.json();
                
                document.getElementById('name').value = user.name || '';
                document.getElementById('surname').value = user.surname || '';
                
                const roleSelect = document.getElementById('role');
                roleSelect.value = user.role || 'student';
                roleSelect.dispatchEvent(new Event('change', { bubbles: true }));

                document.getElementById('class').value = user.class || '';
                
                toggleClassField();
                initCustomSelects();
            } catch (error) { 
                showError("Klaida kraunant vartotojo duomenis.");
            }
        }

        document.getElementById('editUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('errorBox').style.display = 'none';

            const data = Object.fromEntries(new FormData(this).entries());
            try {
                const res = await fetch(`${API_URL}/api/users/edit/${userId}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    credentials: 'include', 
                    body: JSON.stringify(data)
                });
                
                if (res.ok) { 
                    window.location.href = 'administration'; 
                } else { 
                    const r = await res.json(); 
                    showError(r.message || "Klaida išsaugant pakeitimus."); 
                }
            } catch (err) {
                showError("Nepavyko prisijungti prie serverio.");
            }
        });

        window.onload = loadUser;
    </script>
</body>
</html>
