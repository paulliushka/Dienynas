<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Grupės</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Grupės</h1>

        <div class="card" id="addGroupCard" style="display: none;">
            <h2>Sukurti naują grupę</h2>

            <form id="createGroupForm">
                <label>Pavadinimas</label>
                <input type="text" name="group_name" placeholder="Pavadinimas..." required>

                <label>Pasirinkite klasę</label>
                <select name="class" id="class_select" onchange="fetchStudentsByClass()" required>
                    <option value="">-- Pasirinkite klasę --</option>
                </select>

                <div id="teacherSelectContainer" style="display: none;">
                    <label>Pasirinkite mokytoją (-us)</label>
                    <div id="teachers_container" class="scroll-box"></div>
                </div>

                <label>Pasirinkite mokinius</label>
                <div>
                    <button type="button" class="btn btn-secondary mb-8" onclick="selectAllNewGroupStudents()">Pasirinkti visus mokinius</button>
                    <div id="students_container" class="scroll-box">
                        <p class="text-muted-italic">Pirmiausia pasirinkite klasę...</p>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary mt-15">Sukurti</button>
            </form>
        </div>

        <div class="card">
            <h2>Esamos grupės</h2>

            <div class="grid-2-cols" style="margin-bottom: 12px;">
                <div>
                    <label style="margin-top:0;">Filtruoti pagal klasę:</label>
                    <select id="filter_class" onchange="filterGroups()">
                        <option value="">-- Visos klasės --</option>
                    </select>
                </div>
                <div>
                    <label style="margin-top:0;">Paieška (grupė / mokytojas / mokinys):</label>
                    <input type="text" id="filter_search" placeholder="Įveskite paieškos žodį..." oninput="filterGroups()">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Grupė</th>
                            <th>Klasė</th>
                            <th>Mokytojai</th>
                            <th>Mokiniai</th>
                            <th id="actionsTh">Veiksmai</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};
        let allGroups = [];

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();
                if (currentUser.role === 'student') {
                    showToast('Puslapis pasiekiamas tik mokytojams.', 'error');
                    window.location.href = 'dashboard';
                    return;
                }
                await initPage();
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function initPage() {
            if (currentUser.role === 'teacher' || currentUser.role === 'administrator') {
                document.getElementById('addGroupCard').style.display = 'block';
                document.getElementById('teacherSelectContainer').style.display = 'block';

                await loadTeachers();
                await loadClasses();
            }

            await loadClassesFilter();
            await loadGroups();
            if (typeof initCustomSelects === 'function') initCustomSelects();
        }

        async function loadClasses() {
            try {
                const response = await fetch(`${API_URL}/api/classes`, { credentials: 'include' });
                const classes = await response.json();
                const select = document.getElementById('class_select');
                select.innerHTML = '<option value="">-- Pasirinkite klasę --</option>';

                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = `${c} klasė`;
                    select.appendChild(opt);
                });
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                showToast("Nepavyko užkrauti klasių.", "error");
            }
        }

        async function loadClassesFilter() {
            try {
                const response = await fetch(`${API_URL}/api/classes`, { credentials: 'include' });
                const classes = await response.json();
                const select = document.getElementById('filter_class');
                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = `${c} klasė`;
                    select.appendChild(opt);
                });
            } catch (err) {}
        }

        async function loadTeachers() {
            try {
                const response = await fetch(`${API_URL}/api/teachers`, { credentials: 'include' });
                const teachers = await response.json();
                const container = document.getElementById('teachers_container');
                container.innerHTML = '';

                teachers.forEach(t => {
                    const label = document.createElement("label");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "teachers";
                    checkbox.className = "teacher-checkbox";
                    checkbox.value = t.user_id;

                    if (currentUser.role === 'teacher' && Number(t.user_id) === Number(currentUser.user_id)) {
                        checkbox.checked = true;
                    }

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(` ${t.name} ${t.surname}`));
                    container.appendChild(label);
                });
            } catch (error) {
                showToast("Nepavyko užkrauti mokytojų.", "error");
            }
        }

        async function fetchStudentsByClass() {
            const className = document.getElementById("class_select").value;
            const studentsContainer = document.getElementById("students_container");
            studentsContainer.innerHTML = "";

            if (!className) {
                studentsContainer.innerHTML = '<p class="text-muted-italic">Pirmiausia pasirinkite klasę...</p>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/get_students/${className}`, { credentials: 'include' });
                const data = await response.json();

                if (data.length === 0) {
                    studentsContainer.innerHTML = "<p class='text-muted-italic'>Šioje klasėje mokinių nėra.</p>";
                    return;
                }

                data.forEach(student => {
                    const label = document.createElement("label");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "students";
                    checkbox.className = "student-checkbox";
                    checkbox.value = student.user_id;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(` ${student.name} ${student.surname}`));
                    studentsContainer.appendChild(label);
                });
            } catch (error) {
                showToast("Nepavyko užkrauti mokinių.", "error");
            }
        }

        function selectAllNewGroupStudents() {
            document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = true);
        }

        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                allGroups = await response.json();
                renderGroups(allGroups);
            } catch (error) {
                showToast("Nepavyko užkrauti grupių.", "error");
            }
        }

        function renderGroups(groups) {
            const tbody = document.getElementById('groupsTableBody');
            tbody.innerHTML = '';

            if (!Array.isArray(groups) || groups.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Grupių nerasta.</td></tr>`;
                return;
            }

            groups.forEach(g => {
                const tr = document.createElement('tr');
                const isTeacherMember = g.teachers && g.teachers.includes(currentUser.user_id);
                const isOwner = isTeacherMember || currentUser.role === 'administrator';

                const ownerBadge = isTeacherMember ? '<span class="badge-owner">Mano grupė</span>' : '';
                const studentsText = (g.student_names && g.student_names.length > 0) ? g.student_names.join(", ") : '<span class="text-muted-italic">Grupėje mokinių nėra.</span>';

                let rowHtml = `
                    <td data-label="Grupė"><strong>${g.group_name}</strong> ${ownerBadge}</td>
                    <td data-label="Klasė">${g.class} klasė</td>
                    <td data-label="Mokytojai">${g.teacher || '-'}</td>
                    <td data-label="Mokiniai">${studentsText}</td>
                `;

                let actionsTd = '';
                if (isOwner) {
                    actionsTd = `<a href="editing/edit_group?id=${g.group_id}">Redaguoti</a> | <a href="javascript:void(0);" onclick="deleteGroup(${g.group_id}); return false;">Ištrinti</a>`;
                } else {
                    actionsTd = '<span style="color: var(--text-muted);">Neturite teisių</span>';
                }
                rowHtml += `<td data-label="Veiksmai">${actionsTd}</td>`;

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function filterGroups() {
            const filterClass = document.getElementById('filter_class').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allGroups.filter(g => {
                let match = true;
                if (filterClass && String(g.class) !== String(filterClass)) match = false;
                if (searchText) {
                    const studentsStr = (g.student_names || []).join(" ");
                    const combined = `${g.group_name} ${g.class} ${g.teacher} ${studentsStr}`.toLowerCase();
                    if (!combined.includes(searchText)) match = false;
                }
                return match;
            });

            renderGroups(filtered);
        }

        document.getElementById('createGroupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const selectedStudents = Array.from(document.querySelectorAll('.student-checkbox:checked')).map(cb => cb.value);
            const selectedTeachers = Array.from(document.querySelectorAll('.teacher-checkbox:checked')).map(cb => cb.value);

            if (selectedTeachers.length === 0 && currentUser.role === 'administrator') {
                showToast("Pasirinkite bent vieną mokytoją.", "error");
                return;
            }

            const payload = {
                group_name: formData.get('group_name'),
                class: formData.get('class'),
                teachers: selectedTeachers,
                students: selectedStudents
            };

            try {
                const response = await fetch(`${API_URL}/api/groups/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    this.reset();
                    const classSelect = document.getElementById('class_select');
                    classSelect.dispatchEvent(new Event('change', { bubbles: true }));
                    document.getElementById("students_container").innerHTML = '<p class="text-muted-italic">Pirmiausia pasirinkite klasę...</p>';
                    await loadTeachers();
                    showToast("Grupė sėkmingai sukurta!", "success");
                    loadGroups();
                } else {
                    const result = await response.json();
                    showToast(result.message || "Nepavyko sukurti grupės.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        });

        async function deleteGroup(groupId) {
            if (!confirm('Ar tikrai norite ištrinti šią grupę?')) return;
            try {
                const response = await fetch(`${API_URL}/api/groups/delete/${groupId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    showToast("Grupė ištrinta.", "success");
                    loadGroups();
                } else {
                    showToast("Nepavyko ištrinti grupės.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        }

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
