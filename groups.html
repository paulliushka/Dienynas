<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Grupės</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h1>Grupės</h1>

        <!-- Grupės kūrimo forma rodoma tik mokytojams ir administratoriams -->
        <div class="card" id="addGroupCard" style="display: none;">
            <h2>Sukurti naują grupę</h2>
            <form id="createGroupForm">
                <label>Grupės pavadinimas</label>
                <input type="text" name="group_name" placeholder="Pvz., Matematika A lygis" required>

                <label>Pasirinkite klasę</label>
                <select name="class" id="class_select" onchange="fetchStudentsByClass()" required>
                    <option value="">-- Pasirinkite klasę --</option>
                </select>

                <div id="teacherSelectContainer" style="display: none;">
                    <label>Paskirti grupės mokytojus (galima pasirinkti kelis)</label>
                    <div id="teachers_container" class="scroll-box"></div>
                </div>

                <label>Pasirinkite mokinius</label>
                <div>
                    <button type="button" class="btn btn-secondary" onclick="selectAllNewGroupStudents()" style="margin-bottom: 8px;">Pasirinkti visus mokinius</button>
                    <div id="students_container" class="scroll-box">
                        <p style="color: gray; font-style: italic; margin: 0;">Pirmiausia pasirinkite klasę...</p>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Sukurti grupę</button>
            </form>
        </div>

        <div class="card">
            <h2>Esamos grupės</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Grupė</th>
                            <th>Klasė</th>
                            <th>Mokytojai</th>
                            <th>Mokiniai</th>
                            <th id="actionsTh" style="display: none;">Veiksmai</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script src="select.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

        if (!currentUser.user_id) {
            window.location.href = '/';
        }

        async function initPage() {
            // Jeigu vartotojas yra mokytojas arba administratorius – rodome kūrimo formą
            if (currentUser.role === 'teacher' || currentUser.role === 'administrator') {
                document.getElementById('addGroupCard').style.display = 'block';
                document.getElementById('actionsTh').style.display = 'table-cell';

                if (currentUser.role === 'administrator') {
                    document.getElementById('teacherSelectContainer').style.display = 'block';
                    await loadTeachers();
                }
                await loadClasses();
            }

            await loadGroups();
            initCustomSelects();
        }

        async function loadClasses() {
            try {
                const response = await fetch(`${API_URL}/api/classes`);
                const classes = await response.json();

                const select = document.getElementById('class_select');
                select.innerHTML = '<option value="">-- Pasirinkite klasę --</option>';

                classes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = `${c} klasė`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Klaida užkraunant klases:", error);
            }
        }

        async function loadTeachers() {
            try {
                const response = await fetch(`${API_URL}/api/teachers`);
                const teachers = await response.json();

                const container = document.getElementById('teachers_container');
                container.innerHTML = '';

                teachers.forEach(t => {
                    const label = document.createElement("label");

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "teachers";
                    checkbox.className = "teacher-checkbox";
                    checkbox.value = t.user_id;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(`${t.name} ${t.surname}`));
                    container.appendChild(label);
                });
            } catch (error) {
                console.error("Klaida užkraunant mokytojus:", error);
            }
        }

        async function fetchStudentsByClass() {
            const className = document.getElementById("class_select").value;
            const studentsContainer = document.getElementById("students_container");
            studentsContainer.innerHTML = "";

            if (!className) {
                studentsContainer.innerHTML = '<p style="color: gray; font-style: italic; margin: 0;">Pirmiausia pasirinkite klasę...</p>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/get_students/${className}`);
                const data = await response.json();

                if (data.length === 0) {
                    studentsContainer.innerHTML = "<p style='color: gray; font-style: italic; margin:0;'>Šioje klasėje mokinių nėra.</p>";
                    return;
                }

                data.forEach(student => {
                    const label = document.createElement("label");

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "students";
                    checkbox.className = "student-checkbox";
                    checkbox.value = student.user_id;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(`${student.name} ${student.surname}`));
                    studentsContainer.appendChild(label);
                });
            } catch (error) {
                console.error("Klaida užkraunant mokinius:", error);
            }
        }

        function selectAllNewGroupStudents() {
            document.querySelectorAll('.student-checkbox').forEach(cb => cb.checked = true);
        }

        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups?user_id=${currentUser.user_id}&role=${currentUser.role}`);
                const groups = await response.json();

                const tbody = document.getElementById('groupsTableBody');
                tbody.innerHTML = '';

                const showActions = currentUser.role === 'teacher' || currentUser.role === 'administrator';

                if (groups.length === 0) {
                    const colSpan = showActions ? 5 : 4;
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-row">Grupių nėra.</td></tr>`;
                    return;
                }

                groups.forEach(g => {
                    const tr = document.createElement('tr');
                    
                    const isTeacherMember = g.teachers && g.teachers.includes(currentUser.user_id);
                    const isOwner = isTeacherMember || currentUser.role === 'administrator';

                    const ownerBadge = isTeacherMember ? '<span class="badge-owner">Mano grupė</span>' : '';
                    const studentsText = (g.student_names && g.student_names.length > 0) 
                        ? g.student_names.join(", ") 
                        : '<span style="color: gray; font-style: italic;">Grupėje mokinių nėra</span>';

                    let rowHtml = `
                        <td><strong>${g.group_name}</strong> ${ownerBadge}</td>
                        <td>${g.class} klasė</td>
                        <td>${g.teacher || '-'}</td>
                        <td>${studentsText}</td>
                    `;

                    if (showActions) {
                        let actionsTd = '';
                        if (isOwner) {
                            actionsTd = `
                                <a href="edit_group?id=${g.group_id}">Redaguoti</a> | 
                                <a href="javascript:void(0);" onclick="deleteGroup(${g.group_id}); return false;">Ištrinti</a>
                            `;
                        } else {
                            actionsTd = '<span style="color: #64748b;">Neturite teisių</span>';
                        }
                        rowHtml += `<td>${actionsTd}</td>`;
                    }

                    tr.innerHTML = rowHtml;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Klaida užkraunant grupes:", error);
            }
        }

        if (currentUser.role === 'teacher' || currentUser.role === 'administrator') {
            document.getElementById('createGroupForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const formData = new FormData(this);
                const selectedStudents = Array.from(document.querySelectorAll('.student-checkbox:checked')).map(cb => cb.value);
                
                let selectedTeachers = [];
                if (currentUser.role === 'administrator') {
                    selectedTeachers = Array.from(document.querySelectorAll('.teacher-checkbox:checked')).map(cb => cb.value);
                } else {
                    selectedTeachers = [currentUser.user_id];
                }

                const payload = {
                    group_name: formData.get('group_name'),
                    class: formData.get('class'),
                    teachers: selectedTeachers,
                    students: selectedStudents,
                    user_id: currentUser.user_id
                };

                try {
                    const response = await fetch(`${API_URL}/api/groups/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        this.reset();
                        document.getElementById("students_container").innerHTML = '<p style="color: gray; font-style: italic; margin: 0;">Pirmiausia pasirinkite klasę...</p>';
                        loadGroups();
                    } else {
                        const result = await response.json();
                        alert(result.message || "Klaida kuriant grupę.");
                    }
                } catch (error) {
                    alert("Nepavyko prisijungti prie serverio.");
                }
            });
        }

        async function deleteGroup(groupId) {
            if (!confirm('Ar tikrai norite ištrinti šią grupę?')) return;

            try {
                const response = await fetch(`${API_URL}/api/groups/delete/${groupId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadGroups();
                } else {
                    alert("Klaida trinant grupę.");
                }
            } catch (error) {
                alert("Nepavyko prisijungti prie serverio.");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
