<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokslus - Grupės</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Grupės</h1>

        <div class="card">
            <h2>Mano grupės</h2>

            <div class="mb-20">
                <a href="creating/create_group" class="btn btn-primary">+ Sukurti naują grupę</a>
            </div>

            <div class="grid-2-cols" style="margin-bottom: 12px;">
                <div>
                    <label style="margin-top:0;">Filtruoti pagal klasę:</label>
                    <select id="filter_class">
                        <option value="">-- Visos klasės --</option>
                    </select>
                </div>
                <div>
                    <label style="margin-top:0;">Paieška (grupė / mokinys):</label>
                    <input type="text" id="filter_search" placeholder="Įveskite paieškos žodį..." maxlength="100" autocomplete="off">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Grupė</th>
                            <th>Klasė</th>
                            <th>Mokiniai</th>
                            <th>Veiksmai</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};
        let allGroups = [];
        let deleting = false;

        // ---------- Prieiga: puslapis tik mokytojams ----------
        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();
            } catch (err) {
                window.location.href = '/';
                return;
            }

            if (currentUser.role !== 'teacher') {
                showToast('Puslapis pasiekiamas tik mokytojams.', 'error');
                setTimeout(() => { window.location.href = 'dashboard'; }, 1200);
                return;
            }

            try {
                await initPage();
            } catch (err) {
                showToast('Nepavyko užkrauti puslapio.', 'error');
            }
        }

        async function initPage() {
            await loadGroups();
            populateClassFilter();

            document.getElementById('filter_class').addEventListener('change', filterGroups);
            document.getElementById('filter_search').addEventListener('input', filterGroups);

            if (typeof initCustomSelects === 'function') initCustomSelects();
        }

        // ---------- Duomenys ----------
        // Serveris mokytojui grąžina TIK jo paties grupes, todėl čia papildomai nieko filtruoti nereikia.
        async function loadGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                if (!response.ok) throw new Error('bad status');
                const data = await response.json();
                allGroups = Array.isArray(data) ? data : [];
                filterGroups();
            } catch (error) {
                showToast("Nepavyko užkrauti grupių.", "error");
            }
        }

        function populateClassFilter() {
            const select = document.getElementById('filter_class');
            const classes = [...new Set(allGroups.map(g => g.class).filter(Boolean))]
                .sort((a, b) => String(a).localeCompare(String(b), 'lt', { numeric: true }));

            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = `${c} klasė`;
                select.appendChild(opt);
            });
        }

        // ---------- Atvaizdavimas (be innerHTML su serverio duomenimis - apsauga nuo XSS) ----------
        function makeCell(label, child) {
            const td = document.createElement('td');
            td.setAttribute('data-label', label);
            td.appendChild(child);
            return td;
        }

        function mutedText(text) {
            const span = document.createElement('span');
            span.className = 'text-muted-italic';
            span.textContent = text;
            return span;
        }

        function renderGroups(groups, emptyMessage) {
            const tbody = document.getElementById('groupsTableBody');
            tbody.replaceChildren();

            if (groups.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 4;
                td.className = 'empty-row';
                td.textContent = emptyMessage;
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            groups.forEach(g => {
                const tr = document.createElement('tr');

                const name = document.createElement('strong');
                name.textContent = g.group_name;
                tr.appendChild(makeCell('Grupė', name));

                tr.appendChild(makeCell('Klasė', document.createTextNode(g.class ? `${g.class} klasė` : '-')));

                const names = Array.isArray(g.student_names) ? g.student_names : [];
                tr.appendChild(makeCell('Mokiniai', names.length > 0
                    ? document.createTextNode(names.join(', '))
                    : mutedText('Grupėje mokinių nėra.')));

                const actions = document.createDocumentFragment();
                const editLink = document.createElement('a');
                editLink.href = `editing/edit_group?id=${encodeURIComponent(g.group_id)}`;
                editLink.textContent = 'Redaguoti';
                actions.appendChild(editLink);
                actions.appendChild(document.createTextNode(' | '));
                const deleteLink = document.createElement('a');
                deleteLink.href = '#';
                deleteLink.textContent = 'Ištrinti';
                deleteLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    deleteGroup(g);
                });
                actions.appendChild(deleteLink);
                tr.appendChild(makeCell('Veiksmai', actions));

                tbody.appendChild(tr);
            });
        }

        function filterGroups() {
            const filterClass = document.getElementById('filter_class').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allGroups.filter(g => {
                if (filterClass && String(g.class) !== String(filterClass)) return false;
                if (searchText) {
                    const studentsStr = (g.student_names || []).join(' ');
                    const combined = `${g.group_name} ${g.class} ${studentsStr}`.toLowerCase();
                    if (!combined.includes(searchText)) return false;
                }
                return true;
            });

            const noGroupsAtAll = allGroups.length === 0;
            renderGroups(filtered, noGroupsAtAll
                ? 'Dar neturite grupių. Paspauskite „Sukurti naują grupę“.'
                : 'Pagal pasirinktus filtrus grupių nerasta.');
        }

        // ---------- Veiksmai ----------
        async function deleteGroup(group) {
            if (deleting) return;
            const question = `Ar tikrai norite ištrinti grupę „${group.group_name}“?\n\n` +
                'Kartu bus ištrinti ir šios grupės tvarkaraščiai, pažymiai, lankomumas bei pastabos.';
            if (!confirm(question)) return;

            deleting = true;
            try {
                const response = await fetch(`${API_URL}/api/groups/delete/${encodeURIComponent(group.group_id)}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const result = await response.json().catch(() => ({}));

                if (response.ok) {
                    showToast("Grupė ištrinta.", "success");
                    await loadGroups();
                } else {
                    showToast(result.message || "Nepavyko ištrinti grupės.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            } finally {
                deleting = false;
            }
        }

        window.addEventListener('load', checkAuthAndInit);
    </script>
</body>
</html>
