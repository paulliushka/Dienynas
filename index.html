<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Prisijungti</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body class="centered-page-body">
    <div class="card" style="max-width: 400px; width: 100%;">
        <h1>Prisijungti</h1>
        <form id="loginForm">
            <label for="username">Vartotojo vardas</label>
            <input type="text" id="username" name="username" placeholder="Įveskite vartotojo vardą" required>
            
            <label for="password">Slaptažodis</label>
            <input type="password" id="password" name="password" placeholder="Įveskite slaptažodį" required>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Prisijungti</button>
        </form>
        <div style="margin-top: 15px; text-align: center;">
            <a href="register" class="btn-back">Turite registracijos kodą? Užsiregistruokite čia</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = 'dashboard';
                } else {
                    alert(result.message || "Neteisingas vartotojo vardas arba slaptažodis.");
                }
            } catch (error) {
                alert("Nepavyko prisijungti prie serverio.");
            }
        });
    </script>
</body>
</html>
