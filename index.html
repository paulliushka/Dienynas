<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Prisijungimas</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body class="centered-page-body">
    <div class="card register-card">
        <h1>Prisijungti</h1>
        <p class="mb-16">Prisijunkite prie Mokslus sistemos.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Vartotojo vardas</label>
                <input type="text" id="username" name="username" placeholder="Įveskite vartotojo vardą" required>
            </div>
            
            <div class="form-group">
                <label for="password">Slaptažodis</label>
                <input type="password" id="password" name="password" placeholder="Įveskite slaptažodį" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mt-8">Prisijungti</button>
        </form>

        <div class="text-center mt-10">
            <a href="register" class="btn-back">Turite registracijos kodą? Užsiregistruokite čia</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    window.location.href = 'dashboard';
                } else {
                    showToast(result.message || "Neteisingas vartotojo vardas arba slaptažodis.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        });
    </script>
</body>
</html>
