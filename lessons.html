<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pamokų žurnalas</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Pamokų žurnalas (pasirinkimas)</h1>

        <!-- Savaitės pasirinkimo juosta -->
        <div class="card" id="scheduleViewCard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                <button type="button" class="btn btn-secondary" onclick="changeWeek(-1)">← Praeita savaitė</button>
                <h2 id="currentWeekRangeLabel" style="margin:0; border:none; background:none; padding:0;">Savaitė</h2>
                <button type="button" class="btn btn-secondary" onclick="changeWeek(1)">Kita savaitė →</button>
            </div>

            <div id="daysScheduleContainer"></div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};
        let allTimetables = [];
        let weekOffset = 0;

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();

                if (currentUser.role !== 'teacher' && currentUser.role !== 'administrator') {
                    window.location.href = 'dashboard';
                    return;
                }

                await loadTimetablesData();
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function loadTimetablesData() {
            try {
                const res = await fetch(`${API_URL}/api/timetables`, { credentials: 'include' });
                allTimetables = await res.json();
                renderWeekDaysSchedule();
            } catch (err) {
                showToast('Klaida užkraunant tvarkaraštį.', 'error');
            }
        }

        function changeWeek(direction) {
            weekOffset += direction;
            renderWeekDaysSchedule();
        }

        function getDaysOfCurrentWeek() {
            const curr = new Date();
            const firstDayOfWeek = curr.getDate() - curr.getDay() + 1 + (curr.getDay() === 0 ? -6 : 0) + (weekOffset * 7);
            const monday = new Date(curr.setDate(firstDayOfWeek));

            const daysConfig = [
                { name: 'Pirmadienis', offset: 0 },
                { name: 'Antradienis', offset: 1 },
                { name: 'Trečiadienis', offset: 2 },
                { name: 'Ketvirtadienis', offset: 3 },
                { name: 'Penktadienis', offset: 4 }
            ];

            return daysConfig.map(d => {
                const targetDate = new Date(monday);
                targetDate.setDate(monday.getDate() + d.offset);
                const year = targetDate.getFullYear();
                const month = String(targetDate.getMonth() + 1).padStart(2, '0');
                const day = String(targetDate.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${day}`;
                
                return {
                    day_of_week: d.name,
                    date: dateStr,
                    displayDate: `${d.name} (${month}-${day})`
                };
            });
        }

        function renderWeekDaysSchedule() {
            const container = document.getElementById('daysScheduleContainer');
            container.innerHTML = '';
            const weekDays = getDaysOfCurrentWeek();
            
            document.getElementById('currentWeekRangeLabel').textContent = `Savaitė: ${weekDays[0].date} iki ${weekDays[4].date}`;

            weekDays.forEach(dayObj => {
                const dayTimetables = allTimetables.filter(t => t.day_of_week === dayObj.day_of_week);
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-section';
                dayDiv.innerHTML = `<div class="day-title">${dayObj.displayDate}</div>`;

                if (dayTimetables.length === 0) {
                    dayDiv.innerHTML += `<div style="color: var(--text-muted); font-style: italic; padding: 6px 0;">Šią dieną pamokų nėra.</div>`;
                } else {
                    const listDiv = document.createElement('div');
                    listDiv.className = 'lesson-grid-list';

                    dayTimetables.forEach(t => {
                        const card = document.createElement('div');
                        card.className = 'lesson-item-card';
                        card.innerHTML = `
                            <strong>${t.group_display}</strong><br>
                            <span style="color: var(--accent-blue);">${t.lesson_order}</span><br>
                            <span style="color: var(--text-secondary);">Kabinetas: ${t.classroom || '-'}</span><br>
                            <span style="color: var(--text-muted);">Mokytojas: ${t.teacher}</span>
                        `;
                        // Paspaudus eiti į atskirą edit_lesson.html puslapį su URI parametrais
                        card.onclick = () => {
                            window.location.href = `edit_lesson?group_id=${t.group_id}&date=${dayObj.date}`;
                        };
                        listDiv.appendChild(card);
                    });
                    dayDiv.appendChild(listDiv);
                }
                container.appendChild(dayDiv);
            });
        }

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
