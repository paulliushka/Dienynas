<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pamokų žurnalas</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Pamokų žurnalas</h1>

        <!-- Dienų tvarkaraščio rodinys (Pradinis pamokų pasirinkimas) -->
        <div class="card" id="scheduleViewCard">
            <h2>Pasirinkite pamoką iš tvarkaraščio</h2>
            <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center;">
                <label style="margin:0;">Pasirinkite datą:</label>
                <input type="date" id="selected_lesson_date" style="width: 160px;" onchange="loadTimetableLessons()">
            </div>
            <div id="daysScheduleContainer">
                <!-- Dinamiškai užsikraus dienos pamokos -->
            </div>
        </div>

        <!-- Konkrečios pamokos žurnalo redagavimo kortelė -->
        <div class="card" id="journalCard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2 id="journalTitle" style="margin:0;">Pamokos žurnalas</h2>
                <button type="button" class="btn btn-secondary" onclick="backToScheduleList()">← Atgal į tvarkaraštį</button>
            </div>

            <div style="background: var(--bg-input); padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-light);">
                <p><strong>Grupė:</strong> <span id="lblGroup"></span> | <strong>Laikas:</strong> <span id="lblOrder"></span> | <strong>Kabinetas:</strong> <span id="lblClassroom"></span> | <strong>Data:</strong> <span id="lblDate"></span></p>
            </div>

            <!-- Klasės darbas ir namų darbas -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <label>Klasės darbas / Tema</label>
                    <textarea id="class_work_input" rows="2" placeholder="Įveskite klasės darbą..."></textarea>
                </div>
                <div>
                    <label>Namų darbai ir terminas</label>
                    <textarea id="homework_input" rows="2" placeholder="Įveskite namų darbų užduotį..."></textarea>
                </div>
            </div>
            <button type="button" class="btn btn-primary" onclick="saveClassworkAndHomework()" style="margin-bottom: 20px;">Išsaugoti klasės ir namų darbus</button>

            <!-- Mokinių sąrašas (Lankomumas ir pažymiai su tiesioginiu įrašymu) -->
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nr. Mokinys</th>
                            <th>Lankomumas (Tiesioginis)</th>
                            <th>Pažymys (1-10)</th>
                            <th>Tipas</th>
                            <th>Komentaras</th>
                        </tr>
                    </thead>
                    <tbody id="journalTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <!-- Komentaro iššokantis langas (Modal) -->
    <div id="commentModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--accent-blue); margin-bottom: 10px;">Įvesti pažymio komentarą</h3>
            <p id="modalStudentName" style="margin-bottom: 8px; font-weight: bold;"></p>
            <textarea id="modalCommentInput" rows="3" placeholder="Įrašykite komentarą (nebūtina)..." style="width: 100%; margin-bottom: 12px;"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" class="btn btn-secondary" onclick="closeCommentModal()">Atšaukti</button>
                <button type="button" class="btn btn-primary" onclick="saveCommentModal()">Išsaugoti</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = {};
        let allTimetables = [];
        let currentActiveLesson = null;
        let currentStudents = [];
        let activeCommentStudentId = null;

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();

                if (currentUser.role !== 'teacher' && currentUser.role !== 'administrator') {
                    window.location.href = 'dashboard';
                    return;
                }

                setDefaultDate();
                await loadTimetablesData();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function setDefaultDate() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('selected_lesson_date').value = `${now.getFullYear()}-${month}-${day}`;
        }

        async function loadTimetablesData() {
            try {
                const res = await fetch(`${API_URL}/api/timetables`, { credentials: 'include' });
                allTimetables = await res.json();
                loadTimetableLessons();
            } catch (err) {
                showToast('Klaida užkraunant tvarkaraštį.', 'error');
            }
        }

        function getDayOfWeekName(dateStr) {
            const days = ['Sekmadienis', 'Pirmadienis', 'Antradienis', 'Trečiadienis', 'Ketvirtadienis', 'Penktadienis', 'Šeštadienis'];
            const d = new Date(dateStr);
            return days[d.getDay()];
        }

        function loadTimetableLessons() {
            const dateVal = document.getElementById('selected_lesson_date').value;
            const dayName = getDayOfWeekName(dateVal);
            const container = document.getElementById('daysScheduleContainer');
            container.innerHTML = '';

            const dayTimetables = allTimetables.filter(t => t.day_of_week === dayName);

            if (dayTimetables.length === 0) {
                container.innerHTML = `<div class="empty-row">Šiai dienai (${dayName}) suplanuotų pamokų nėra.</div>`;
                return;
            }

            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-section';
            dayDiv.innerHTML = `<div class="day-title">${dayName} (${dateVal})</div>`;
            const listDiv = document.createElement('div');
            listDiv.className = 'lesson-grid-list';

            dayTimetables.forEach(t => {
                const card = document.createElement('div');
                card.className = 'lesson-item-card';
                card.innerHTML = `
                    <strong>${t.group_display}</strong><br>
                    <span style="color: var(--accent-blue);">${t.lesson_order}</span><br>
                    <span style="color: var(--text-secondary);">Kabinetas: ${t.classroom}</span><br>
                    <span style="color: var(--text-muted);">Mokytojas: ${t.teacher}</span>
                `;
                card.onclick = () => openLessonJournal(t, dateVal);
                listDiv.appendChild(card);
            });

            dayDiv.appendChild(listDiv);
            container.appendChild(dayDiv);
        }

        async function openLessonJournal(timetableItem, dateStr) {
            currentActiveLesson = { ...timetableItem, date: dateStr };
            document.getElementById('scheduleViewCard').style.display = 'none';
            document.getElementById('journalCard').style.display = 'block';

            document.getElementById('lblGroup').textContent = timetableItem.group_display;
            document.getElementById('lblOrder').textContent = timetableItem.lesson_order;
            document.getElementById('lblClassroom').textContent = timetableItem.classroom;
            document.getElementById('lblDate').textContent = dateStr;

            await loadGroupStudentsAndJournalData(timetableItem.group_id, dateStr);
        }

        function backToScheduleList() {
            document.getElementById('journalCard').style.display = 'none';
            document.getElementById('scheduleViewCard').style.display = 'block';
            loadTimetableLessons();
        }

        async function loadGroupStudentsAndJournalData(groupId, dateStr) {
            const tbody = document.getElementById('journalTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Kraunami duomenys...</td></tr>`;

            try {
                // Gauname grupės mokinius
                const resStu = await fetch(`${API_URL}/get_students_by_group/${groupId}`, { credentials: 'include' });
                currentStudents = await resStu.json();

                // Gauname jau išsaugotus žurnalo duomenis (lankomumą, pažymius, darbus)
                const resJ = await fetch(`${API_URL}/api/lesson-journal/data?group_id=${groupId}&date=${dateStr}`, { credentials: 'include' });
                const journalData = await resJ.json();

                document.getElementById('class_work_input').value = journalData.class_work || '';
                document.getElementById('homework_input').value = journalData.homework || '';

                tbody.innerHTML = '';
                if (currentStudents.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Šioje grupėje mokinių nėra.</td></tr>`;
                    return;
                }

                currentStudents.forEach((s, idx) => {
                    const studentId = s.user_id;
                    const attStatus = journalData.attendance[studentId] || 'present'; // numatytasis dalyvauja
                    const gradeInfo = journalData.grades[studentId] || { grade: '', type: 'Klasės darbas', comment: '' };

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${idx + 1}. ${s.name} ${s.surname}</strong></td>
                        <td>
                            <div style="display: flex; gap: 4px;">
                                <button type="button" class="btn-att ${attStatus === 'absent_unexcused' ? 'active-n' : ''}" onclick="setAttendance(${studentId}, 'absent_unexcused', this)">N</button>
                                <button type="button" class="btn-att ${attStatus === 'late' ? 'active-v' : ''}" onclick="setAttendance(${studentId}, 'late', this)">V</button>
                                <button type="button" class="btn-att ${attStatus === 'present' ? 'active-p' : ''}" style="font-size:9px;" onclick="setAttendance(${studentId}, 'present', this)" title="Dalyvauja (valyti)">✔</button>
                            </div>
                        </td>
                        <td>
                            <input type="text" value="${gradeInfo.grade}" onblur="saveGradeInstant(${studentId}, this)" placeholder="1-10" style="width: 60px; text-align: center;">
                        </td>
                        <td>
                            <select onchange="saveGradeInstant(${studentId}, this)" class="grade-type-sel" style="padding: 2px;">
                                <option value="Klasės darbas" ${gradeInfo.type === 'Klasės darbas' ? 'selected' : ''}>Klasės darbas</option>
                                <option value="Savarankiškas darbas" ${gradeInfo.type === 'Savarankiškas darbas' ? 'selected' : ''}>Savarankiškas darbas</option>
                                <option value="Namų darbas" ${gradeInfo.type === 'Namų darbas' ? 'selected' : ''}>Namų darbas</option>
                                <option value="Kontrolinis darbas" ${gradeInfo.type === 'Kontrolinis darbas' ? 'selected' : ''}>Kontrolinis darbas</option>
                            </select>
                        </td>
                        <td>
                            <button type="button" class="btn btn-secondary" style="padding: 2px 8px; font-size:10px;" onclick="openCommentModal(${studentId}, '${s.name} ${s.surname}', '${gradeInfo.comment.replace(/'/g, "\\'")}')">
                                💬 ${gradeInfo.comment ? 'Komentaras (yra)' : 'Pridėti komentarą'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                showToast('Klaida užkraunant pamokos duomenis.', 'error');
            }
        }

        async function setAttendance(studentId, status, btnElement) {
            const row = btnElement.closest('tr');
            row.querySelectorAll('.btn-att').forEach(b => { b.classList.remove('active-n', 'active-v'); });
            
            if (status === 'absent_unexcused') btnElement.classList.add('active-n');
            if (status === 'late') btnElement.classList.add('active-v');

            try {
                await fetch(`${API_URL}/api/lesson-journal/save-attendance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        group_id: currentActiveLesson.group_id,
                        student_id: studentId,
                        date: currentActiveLesson.date,
                        status: status
                    })
                });
                showToast('Lankomumas atnaujintas', 'success');
            } catch (err) {
                showToast('Nepavyko išsaugoti lankomumo.', 'error');
            }
        }

        async function saveGradeInstant(studentId, inputElement) {
            const row = inputElement.closest('tr');
            const gradeVal = row.querySelector('input[type="text"]').value.trim();
            const typeVal = row.querySelector('.grade-type-sel').value;

            try {
                await fetch(`${API_URL}/api/lesson-journal/save-grade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        group_id: currentActiveLesson.group_id,
                        student_id: studentId,
                        date: currentActiveLesson.date,
                        grade: gradeVal,
                        type: typeVal,
                        comment: inputElement.dataset.comment || ''
                    })
                });
                if (gradeVal !== '') showToast('Pažymys įrašytas', 'success');
            } catch (err) {
                showToast('Klaida įrašant pažymį.', 'error');
            }
        }

        function openCommentModal(studentId, studentName, currentComment) {
            activeCommentStudentId = studentId;
            document.getElementById('modalStudentName').textContent = studentName;
            document.getElementById('modalCommentInput').value = currentComment;
            document.getElementById('commentModal').style.display = 'flex';
        }

        function closeCommentModal() {
            document.getElementById('commentModal').style.display = 'none';
            activeCommentStudentId = null;
        }

        async function saveCommentModal() {
            if (!activeCommentStudentId) return;
            const commentText = document.getElementById('modalCommentInput').value.trim();
            
            // Surandame atitinkamą eilutę lentelėje
            const rows = document.querySelectorAll('#journalTableBody tr');
            let targetRow = null;
            let targetStudentIdx = null;
            
            currentStudents.forEach((s, idx) => {
                if (s.user_id === activeCommentStudentId) {
                    targetStudentIdx = idx;
                }
            });

            if (targetStudentIdx !== null) {
                targetRow = rows[targetStudentIdx];
                const gradeInput = targetRow.querySelector('input[type="text"]');
                const gradeVal = gradeInput.value.trim();
                const typeVal = targetRow.querySelector('.grade-type-sel').value;

                // Išsaugome su nauju komentaru per API
                try {
                    await fetch(`${API_URL}/api/lesson-journal/save-grade`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            group_id: currentActiveLesson.group_id,
                            student_id: activeCommentStudentId,
                            date: currentActiveLesson.date,
                            grade: gradeVal,
                            type: typeVal,
                            comment: commentText
                        })
                    });
                    showToast('Komentaras išsaugotas!', 'success');
                    closeCommentModal();
                    loadGroupStudentsAndJournalData(currentActiveLesson.group_id, currentActiveLesson.date);
                } catch (err) {
                    showToast('Klaida išsaugant komentarą.', 'error');
                }
            }
        }

        async function saveClassworkAndHomework() {
            const classWork = document.getElementById('class_work_input').value.trim();
            const homeworkTask = document.getElementById('homework_input').value.trim();

            try {
                const res = await fetch(`${API_URL}/api/lesson-journal/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        group_id: currentActiveLesson.group_id,
                        date: currentActiveLesson.date,
                        class_work: classWork,
                        homework_task: homeworkTask
                    })
                });
                if (res.ok) {
                    showToast('Pamokos darbai ir namų darbai išsaugoti!', 'success');
                } else {
                    showToast('Klaida išsaugant.', 'error');
                }
            } catch (err) {
                showToast('Nepavyko pasiekti serverio.', 'error');
            }
        }

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
