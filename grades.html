<!DOCTYPE html>
<html lang="lt">
    <head>
        <meta charset="UTF-8">
        <title>Pažymiai</title>
        <link rel="icon" href="favicon.svg">
        <link rel="stylesheet" href="style.css">
        <script src="config.js"></script>
    </head>
    <body>
        <div class="container">
            <h1>Pažymiai</h1>

            <!-- Rašymo forma (rodoma tik mokytojams) -->
            <div class="card" id="addGradeCard" style="display: none;">
                <h2>Rašyti pažymį</h2>
                <form id="addGradeForm">
                    <label>Dalykas ir Grupė</label>
                    <select name="subject" id="subject-select" onchange="updateStudents()" required>
                        <option value="">-- Pasirinkite grupę --</option>
                    </select>

                    <label>Mokinys</label>
                    <select name="student" id="student-select" required>
                        <option value="">-- Pirmiausia pasirinkite grupę --</option>
                    </select>

                    <label>Pažymys</label>
                    <input type="text" name="grade" placeholder="Pvz: 10, p, n" required>

                    <label>Atsiskaitymo tipas</label>
                    <select name="type" required>
                        <option value="Savarankiškas darbas">Savarankiškas darbas</option>
                        <option value="Kontrolinis darbas">Kontrolinis darbas</option>
                        <option value="Projektinis darbas">Projektinis darbas</option>
                        <option value="Klasės darbas">Klasės darbas</option>
                        <option value="Namų darbas">Namų darbas</option>
                        <option value="Kaupiamasis">Kaupiamasis</option>
                    </select>

                    <label>Data</label>
                    <input type="text" name="date" id="grades-datepicker" placeholder="Pasirinkite datą..." readonly required>

                    <label>Komentaras (neprivaloma)</label>
                    <input type="text" name="comment" placeholder="Komentaras mokinio tėvams...">

                    <button type="submit" class="btn btn-primary">Įrašyti pažymį</button>
                </form>
            </div>

            <div class="card">
                <h2>Pažymių suvestinė</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr id="tableHeader">
                                <th>Dalykas</th>
                                <th>Mokinys</th>
                                <th>Pažymys</th>
                                <th>Tipas</th>
                                <th>Data</th>
                                <th>Komentaras</th>
                                <th>Mokytojas</th>
                                <!-- Veiksmai bus pridedami dinamiskai mokytojams -->
                            </tr>
                        </thead>
                        <tbody id="gradesTableBody">
                            <!-- Duomenys kraunami dinamiškai -->
                        </tbody>
                    </table>
                </div>
            </div>

            <a href="dashboard.html" class="btn-back">← Grįžti į pagrindinį</a>
        </div>

        <script src="calendar.js"></script>
        <script>
            const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

            if (!currentUser.user_id) {
                window.location.href = 'index.html';
            }

            async function initPage() {
                // Jei mokytojas – rodom forma ir veiksmų stulpelį lentelėje
                if (currentUser.role === 'teacher') {
                    document.getElementById('addGradeCard').style.display = 'block';
                    
                    const th = document.createElement('th');
                    th.textContent = 'Veiksmai';
                    th.id = 'actionsHeader';
                    document.getElementById('tableHeader').appendChild(th);

                    loadTeacherGroups();
                    if (typeof initCalendar === 'function') {
                        initCalendar("grades-datepicker", false);
                    }
                }

                loadGrades();
            }

            // Užkrauna mokytojo grupes į išskleidžiamąjį sąrašą
            async function loadTeacherGroups() {
                try {
                    const response = await fetch(`${API_URL}/api/groups`);
                    const groups = await response.json();
                    
                    const subjectSelect = document.getElementById('subject-select');
                    subjectSelect.innerHTML = '<option value="">-- Pasirinkite grupę --</option>';

                    groups.forEach(g => {
                        if (g.teacher_id == currentUser.user_id || currentUser.role === 'administrator') {
                            const opt = document.createElement('option');
                            opt.value = g.subject_id;
                            opt.textContent = `${g.subject} (${g.class})`;
                            subjectSelect.appendChild(opt);
                        }
                    });
                } catch (error) {
                    console.error("Klaida užkraunant grupes:", error);
                }
            }

            // Užkrauna pasirinktos grupės mokinius
            async function updateStudents() {
                const subjectId = document.getElementById("subject-select").value;
                const studentSelect = document.getElementById("student-select");

                studentSelect.innerHTML = '<option value="">-- Pasirinkite mokinį --</option>';

                if (!subjectId) return;

                try {
                    const response = await fetch(`${API_URL}/get_students_by_subject/${subjectId}`);
                    const data = await response.json();

                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    data.forEach(student => {
                        const option = document.createElement("option");
                        option.value = student.user_id;
                        option.textContent = `${student.name} ${student.surname}`;
                        studentSelect.appendChild(option);
                    });
                } catch (error) {
                    console.error('Klaida kraunant mokinius:', error);
                }
            }

            // Užkrauna pažymius
            async function loadGrades() {
                try {
                    const response = await fetch(`${API_URL}/api/grades?user_id=${currentUser.user_id}&role=${currentUser.role}`);
                    const grades = await response.json();

                    const tbody = document.getElementById('gradesTableBody');
                    tbody.innerHTML = '';

                    grades.forEach(g => {
                        const tr = document.createElement('tr');
                        
                        let actionsTd = '';
                        if (currentUser.role === 'teacher') {
                            actionsTd = `
                                <td>
                                    <a href="edit_grade.html?id=${g.grade_id}">Redaguoti</a> | 
                                    <a href="#" onclick="deleteGrade(${g.grade_id}); return false;">Ištrinti</a>
                                </td>
                            `;
                        }

                        tr.innerHTML = `
                            <td>${g.subject_display || '-'}</td>
                            <td><strong>${g.student || '-'}</strong></td>
                            <td>${g.grade}</td>
                            <td>${g.type}</td>
                            <td>${g.date}</td>
                            <td>${g.comment ? g.comment : '-'}</td>
                            <td>${g.teacher || '-'}</td>
                            ${actionsTd}
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (error) {
                    console.error("Klaida užkraunant pažymius:", error);
                }
            }

            // Naujo pažymio įrašymas
            document.getElementById('addGradeForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const formData = new FormData(this);
                const data = Object.fromEntries(formData.entries());
                data.teacher_id = currentUser.user_id;

                try {
                    const response = await fetch(`${API_URL}/api/grades/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        this.reset();
                        document.getElementById('student-select').innerHTML = '<option value="">-- Pirmiausia pasirinkite grupę --</option>';
                        loadGrades();
                    } else {
                        const result = await response.json();
                        alert(result.message || "Klaida įrašant pažymį.");
                    }
                } catch (error) {
                    alert("Nepavyko prisijungti prie serverio.");
                }
            });

            // Pažymio ištrynimas
            async function deleteGrade(gradeId) {
                if (!confirm('Ar tikrai norite ištrinti šį pažymį?')) return;

                try {
                    const response = await fetch(`${API_URL}/api/grades/delete/${gradeId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        loadGrades();
                    } else {
                        alert("Klaida trinant pažymį.");
                    }
                } catch (error) {
                    alert("Nepavyko prisijungti prie serverio.");
                }
            }

            window.onload = initPage;
        </script>
    </body>
</html>
