<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Pažymiai</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h1>Pažymiai</h1>
        <div class="card" id="addGradeCard" style="display: none;">
            <h2>Įrašyti naują pažymį</h2>
            <form id="addGradeForm">
                <label>Grupė</label>
                <select name="group_id" id="group_select" onchange="loadStudentsByGroup()" required>
                    <option value="">-- Pasirinkite grupę --</option>
                </select>

                <label>Mokinys</label>
                <select name="student_id" id="student_select" required disabled>
                    <option value="">-- Pirmiausia pasirinkite grupę --</option>
                </select>

                <label>Pažymys</label>
                <input type="text" name="grade" placeholder="Pvz., 10 arba N" required>

                <label>Atsiskaitymo tipas</label>
                <select name="type" required>
                    <option value="Savarankiškas darbas">Savarankiškas darbas</option>
                    <option value="Kontrolinis darbas">Kontrolinis darbas</option>
                    <option value="Projektinis darbas">Projektinis darbas</option>
                    <option value="Klasės darbas">Klasės darbas</option>
                    <option value="Namų darbas">Namų darbas</option>
                    <option value="Kaupiamasis">Kaupiamasis</option>
                </select>

                <label>Data</label>
                <input type="date" name="date" id="grade_date" required>

                <label>Komentaras (neprivalomas)</label>
                <input type="text" name="comment" placeholder="Komentaras...">

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Įrašyti pažymį</button>
            </form>
        </div>

        <div class="card">
            <h2>Pažymių sąrašas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="gradesTableHeader">
                            <th>Mokinys</th>
                            <th>Grupė</th>
                            <th>Pažymys</th>
                            <th>Tipas</th>
                            <th>Data</th>
                            <th>Komentaras</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="gradesTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

        if (!currentUser.user_id) {
            window.location.href = '/';
        }

        async function initPage() {
            if (currentUser.role === 'teacher') {
                document.getElementById('addGradeCard').style.display = 'block';
                document.getElementById('grade_date').valueAsDate = new Date();
                loadTeacherGroups();
            }

            loadGrades();
        }

        async function loadTeacherGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups?user_id=${currentUser.user_id}&role=teacher&only_mine=true`);
                const groups = await response.json();

                const select = document.getElementById('group_select');
                select.innerHTML = '<option value="">-- Pasirinkite grupę --</option>';

                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.group_id;
                    opt.textContent = `${g.group_name} (${g.class} klasė)`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Klaida užkraunant grupes:", error);
            }
        }

        async function loadStudentsByGroup() {
            const groupId = document.getElementById('group_select').value;
            const select = document.getElementById('student_select');

            if (!groupId) {
                select.innerHTML = '<option value="">-- Pirmiausia pasirinkite grupę --</option>';
                select.disabled = true;
                return;
            }

            try {
                const response = await fetch(`${API_URL}/get_students_by_group/${groupId}`);
                const students = await response.json();

                select.innerHTML = '<option value="">-- Pasirinkite mokinį --</option>';
                students.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.user_id;
                    opt.textContent = `${s.name} ${s.surname}`;
                    select.appendChild(opt);
                });
                select.disabled = false;
            } catch (error) {
                console.error("Klaida užkraunant mokinius:", error);
            }
        }

        async function loadGrades() {
            try {
                const response = await fetch(`${API_URL}/api/grades?user_id=${currentUser.user_id}&role=${currentUser.role}`);
                const grades = await response.json();

                const theader = document.getElementById('gradesTableHeader');
                const tbody = document.getElementById('gradesTableBody');
                tbody.innerHTML = '';

                const showActions = currentUser.role === 'teacher';

                if (showActions && !document.getElementById('actionsHeader')) {
                    const th = document.createElement('th');
                    th.id = 'actionsHeader';
                    th.textContent = 'Veiksmai';
                    theader.appendChild(th);
                }

                if (grades.length === 0) {
                    const colSpan = showActions ? 8 : 7;
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-row">Pažymių nėra.</td></tr>`;
                    return;
                }

                grades.forEach(g => {
                    const tr = document.createElement('tr');
                    const isGroupTeacher = g.group_teachers && g.group_teachers.includes(currentUser.user_id);

                    let rowHtml = `
                        <td><strong>${g.student}</strong></td>
                        <td>${g.group_display}</td>
                        <td><span class="badge-grade">${g.grade}</span></td>
                        <td>${g.type}</td>
                        <td>${g.date}</td>
                        <td>${g.comment || '-'}</td>
                        <td>${g.teacher || '-'}</td>
                    `;

                    if (showActions) {
                        const actionsTd = isGroupTeacher 
                            ? `<a href="edit_grade?id=${g.grade_id}">Redaguoti</a> | <a href="javascript:void(0);" onclick="deleteGrade(${g.grade_id}); return false;">Ištrinti</a>`
                            : '<span style="color: #64748b;">Neturite teisių</span>';
                        
                        rowHtml += `<td>${actionsTd}</td>`;
                    }

                    tr.innerHTML = rowHtml;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Klaida užkraunant pažymius:", error);
            }
        }

        if (currentUser.role === 'teacher') {
            document.getElementById('addGradeForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const formData = new FormData(this);
                const payload = {
                    student_id: formData.get('student_id'),
                    group_id: formData.get('group_id'),
                    grade: formData.get('grade'),
                    type: formData.get('type'),
                    date: formData.get('date'),
                    comment: formData.get('comment'),
                    teacher_id: currentUser.user_id
                };

                try {
                    const response = await fetch(`${API_URL}/api/grades/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        this.reset();
                        document.getElementById('grade_date').valueAsDate = new Date();
                        document.getElementById('student_select').disabled = true;
                        loadGrades();
                    } else {
                        const errResult = await response.json();
                        alert(errResult.message || "Klaida įrašant pažymį.");
                    }
                } catch (error) {
                    alert("Nepavyko prisijungti prie serverio.");
                }
            });
        }

        async function deleteGrade(gradeId) {
            if (!confirm('Ar tikrai norite ištrinti šį pažymį?')) return;

            try {
                const response = await fetch(`${API_URL}/api/grades/delete/${gradeId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadGrades();
                } else {
                    alert("Klaida trinant pažymį.");
                }
            } catch (error) {
                alert("Nepavyko prisijungti prie serverio.");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
