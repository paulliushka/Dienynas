<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pažymiai</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Mano pažymiai</h1>

        <div class="card">
            <h2>Pažymių sąrašas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Grupė / Dalykas</th>
                            <th>Pažymys</th>
                            <th>Tipas</th>
                            <th>Data</th>
                            <th>Komentaras</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="gradesTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                const currentUser = await response.json();

                if (currentUser.role !== 'student') {
                    showToast('Puslapis pasiekiamas tik mokiniams.', 'error');
                    window.location.href = 'dashboard';
                    return;
                }

                await loadGrades();
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function loadGrades() {
            try {
                const response = await fetch(`${API_URL}/api/grades`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                const grades = await response.json();
                const tbody = document.getElementById('gradesTableBody');
                tbody.innerHTML = '';

                if (!Array.isArray(grades) || grades.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="empty-row">Pažymių nerasta.</td></tr>`;
                    return;
                }

                grades.forEach(g => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="Grupė"><strong>${g.group_display}</strong></td>
                        <td data-label="Pažymys"><span class="badge-grade">${g.grade}</span></td>
                        <td data-label="Tipas">${g.type}</td>
                        <td data-label="Data">${g.date}</td>
                        <td data-label="Komentaras">${g.comment || '-'}</td>
                        <td data-label="Mokytojas">${g.teacher || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showToast('Nepavyko užkrauti pažymių.', 'error');
            }
        }

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
