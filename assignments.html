<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Namų darbai</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h1>Namų darbai</h1>

        <div class="card" id="addAssignmentCard" style="display: none;">
            <h2>Paskirti naują namų darbą</h2>
            <div id="formErrorBox" class="error-message"></div>

            <form id="addAssignmentForm">
                <label>Grupė</label>
                <select name="group_id" id="group_select" required>
                    <option value="">-- Pasirinkite grupę --</option>
                </select>

                <label>Užduoties aprašymas</label>
                <textarea name="task" rows="3" placeholder="Užduoties aprašymas..." required></textarea>

                <label>Atlikti iki</label>
                <input type="date" name="due_date" id="due_date" required>

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Paskirti</button>
            </form>
        </div>

        <div class="card">
            <h2>Esami namų darbai</h2>
            <div id="tableErrorBox" class="error-message"></div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="assignmentsTableHeader">
                            <th>Grupė</th>
                            <th>Užduotis</th>
                            <th>Atlikti iki</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="assignmentsTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti atgal</a>
    </div>

    <script src="calendar.js"></script>
    <script src="select.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

        if (!currentUser.user_id) {
            window.location.href = '/';
        }

        function showError(boxId, msg) {
            const box = document.getElementById(boxId);
            if (box) {
                box.textContent = msg;
                box.style.display = 'block';
            }
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(box => box.style.display = 'none');
        }

        function setDefaultDate() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateInput = document.getElementById('due_date');
            if (dateInput) {
                dateInput.value = `${now.getFullYear()}-${month}-${day}`;
                dateInput.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        async function initPage() {
            if (currentUser.role === 'teacher') {
                document.getElementById('addAssignmentCard').style.display = 'block';
                setDefaultDate();
                await loadTeacherGroups();
            }

            await loadAssignments();
            initCalendarPickers();
            initCustomSelects();
        }

        async function loadTeacherGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups?only_mine=true`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                const groups = await response.json();

                const select = document.getElementById('group_select');
                select.innerHTML = '<option value="">-- Pasirinkite grupę --</option>';

                if (Array.isArray(groups)) {
                    groups.forEach(g => {
                        const opt = document.createElement('option');
                        opt.value = g.group_id;
                        opt.textContent = `${g.group_name} (${g.class} klasė)`;
                        select.appendChild(opt);
                    });
                }
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                showError('formErrorBox', 'Klaida užkraunant grupes.');
            }
        }

        async function loadAssignments() {
            try {
                const response = await fetch(`${API_URL}/api/assignments`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                const assignments = await response.json();

                const theader = document.getElementById('assignmentsTableHeader');
                const tbody = document.getElementById('assignmentsTableBody');
                tbody.innerHTML = '';

                const showActions = currentUser.role === 'teacher';

                if (showActions && !document.getElementById('actionsHeader')) {
                    const th = document.createElement('th');
                    th.id = 'actionsHeader';
                    th.textContent = 'Veiksmai';
                    theader.appendChild(th);
                }

                if (!Array.isArray(assignments) || assignments.length === 0) {
                    const colSpan = showActions ? 5 : 4;
                    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-row">Namų darbų nėra.</td></tr>`;
                    return;
                }

                assignments.forEach(assign => {
                    const tr = document.createElement('tr');
                    const isGroupTeacher = assign.group_teachers && assign.group_teachers.includes(currentUser.user_id);

                    let rowHtml = `
                        <td data-label="Grupė"><strong>${assign.group_display}</strong></td>
                        <td data-label="Užduotis">${assign.task}</td>
                        <td data-label="Atlikti iki">${assign.due_date}</td>
                        <td data-label="Mokytojas">${assign.teacher || '-'}</td>
                    `;

                    if (showActions) {
                        const actionsTd = isGroupTeacher 
                            ? `<a href="edit_assignment?id=${assign.assignment_id}">Redaguoti</a> | <a href="javascript:void(0);" onclick="deleteAssignment(${assign.assignment_id}); return false;">Ištrinti</a>`
                            : '<span style="color: #8a8d91;">Neturite teisių</span>';
                        
                        rowHtml += `<td data-label="Veiksmai">${actionsTd}</td>`;
                    }

                    tr.innerHTML = rowHtml;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showError('tableErrorBox', 'Klaida užkraunant namų darbus.');
            }
        }

        if (currentUser.role === 'teacher') {
            document.getElementById('addAssignmentForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                clearErrors();

                const formData = new FormData(this);
                const payload = {
                    group_id: formData.get('group_id'),
                    task: formData.get('task'),
                    due_date: formData.get('due_date')
                };

                try {
                    const response = await fetch(`${API_URL}/api/assignments/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        this.reset();
                        setDefaultDate();
                        loadAssignments();
                    } else {
                        const errResult = await response.json();
                        showError('formErrorBox', errResult.message || "Klaida pridedant namų darbą.");
                    }
                } catch (error) {
                    showError('formErrorBox', "Nepavyko prisijungti prie serverio.");
                }
            });
        }

        async function deleteAssignment(assignmentId) {
            if (!confirm('Ar tikrai norite ištrinti šį namų darbą?')) return;
            clearErrors();

            try {
                const response = await fetch(`${API_URL}/api/assignments/delete/${assignmentId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    loadAssignments();
                } else {
                    showError('tableErrorBox', "Klaida trinant namų darbą.");
                }
            } catch (error) {
                showError('tableErrorBox', "Nepavyko prisijungti prie serverio.");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
