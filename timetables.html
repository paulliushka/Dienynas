<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Pamokų tvarkaraštis</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Pamokų tvarkaraštis</h1>

        <!-- Mokytojo / Administratoriaus forma naujai pamokai suplanuoti -->
        <div class="card" id="addTimetableCard" style="display: none;">
            <h2>Pridėti pamoką į tvarkaraštį</h2>

            <form id="addTimetableForm">
                <label>Grupė</label>
                <select name="group_id" id="group_select" required>
                    <option value="">-- Pasirinkite grupę --</option>
                </select>

                <label>Savaitės diena</label>
                <select name="day_of_week" required>
                    <option value="Pirmadienis">Pirmadienis</option>
                    <option value="Antradienis">Antradienis</option>
                    <option value="Trečiadienis">Trečiadienis</option>
                    <option value="Ketvirtadienis">Ketvirtadienis</option>
                    <option value="Penktadienis">Penktadienis</option>
                </select>

                <label>Pamokos laikas</label>
                <select name="lesson_order" required>
                    <option value="1 pamoka (09:00 - 09:45)">1 pamoka (09:00 - 09:45)</option>
                    <option value="2 pamoka (09:55 - 10:40)">2 pamoka (09:55 - 10:40)</option>
                    <option value="3 pamoka (10:55 - 11:40)">3 pamoka (10:55 - 11:40)</option>
                    <option value="4 pamoka (12:00 - 12:45)">4 pamoka (12:00 - 12:45)</option>
                    <option value="5 pamoka (13:15 - 14:00)">5 pamoka (13:15 - 14:00)</option>
                    <option value="6 pamoka (14:10 - 14:55)">6 pamoka (14:10 - 14:55)</option>
                    <option value="7 pamoka (15:10 - 15:55)">7 pamoka (15:10 - 15:55)</option>
                </select>

                <label>Kabinetas</label>
                <input type="text" name="classroom" placeholder="Pvz.: 214 kab." required>

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Pridėti pamoką</button>
            </form>
        </div>

        <!-- Tvarkaraščio peržiūros kortelė -->
        <div class="card">
            <h2>Esamas tvarkaraštis</h2>

            <!-- Filtravimo juosta -->
            <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 180px;">
                    <label style="margin-top:0;">Filtruoti pagal dieną:</label>
                    <select id="filter_day" onchange="filterTimetable()">
                        <option value="">-- Visos dienos --</option>
                        <option value="Pirmadienis">Pirmadienis</option>
                        <option value="Antradienis">Antradienis</option>
                        <option value="Trečiadienis">Trečiadienis</option>
                        <option value="Ketvirtadienis">Ketvirtadienis</option>
                        <option value="Penktadienis">Penktadienis</option>
                    </select>
                </div>
                <div style="flex: 2; min-width: 220px;">
                    <label style="margin-top:0;">Paieška (grupė / kabinetas / mokytojas):</label>
                    <input type="text" id="filter_search" placeholder="Įveskite paieškos žodį..." oninput="filterTimetable()">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="timetableTableHeader">
                            <th>Diena</th>
                            <th>Laikas / Pamoka</th>
                            <th>Grupė</th>
                            <th>Kabinetas</th>
                            <th>Mokytojas</th>
                        </tr>
                    </thead>
                    <tbody id="timetableTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script src="select.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        if (!currentUser.user_id) { window.location.href = '/'; }

        let allTimetableEntries = [];

        async function initPage() {
            if (currentUser.role === 'teacher' || currentUser.role === 'administrator') {
                document.getElementById('addTimetableCard').style.display = 'block';
                await loadTeacherGroups();
            }

            await loadTimetable();
            initCustomSelects();
        }

        async function loadTeacherGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups`, { credentials: 'include' });
                const groups = await response.json();
                const select = document.getElementById('group_select');
                select.innerHTML = '<option value="">-- Pasirinkite grupę --</option>';

                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.group_id;
                    opt.textContent = `${g.group_name} (${g.class} klasė)`;
                    select.appendChild(opt);
                });
                select.dispatchEvent(new Event('change', { bubbles: true }));
            } catch (error) {
                showToast('Klaida užkraunant grupes.', 'error');
            }
        }

        async function loadTimetable() {
            try {
                const response = await fetch(`${API_URL}/api/timetable`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                allTimetableEntries = await response.json();
                renderTimetable(allTimetableEntries);
            } catch (error) {
                showToast('Klaida užkraunant tvarkaraštį.', 'error');
            }
        }

        function renderTimetable(entries) {
            const theader = document.getElementById('timetableTableHeader');
            const tbody = document.getElementById('timetableTableBody');
            tbody.innerHTML = '';

            const showActions = currentUser.role === 'teacher' || currentUser.role === 'administrator';

            if (showActions && !document.getElementById('actionsHeader')) {
                const th = document.createElement('th');
                th.id = 'actionsHeader';
                th.textContent = 'Veiksmai';
                theader.appendChild(th);
            }

            if (!Array.isArray(entries) || entries.length === 0) {
                const colSpan = showActions ? 6 : 5;
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-row">Tvarkaraščio įrašų nerasta.</td></tr>`;
                return;
            }

            entries.forEach(t => {
                const tr = document.createElement('tr');
                const isOwner = currentUser.role === 'administrator' || (t.group_teachers && t.group_teachers.includes(currentUser.user_id));

                let rowHtml = `
                    <td data-label="Diena"><strong>${t.day_of_week}</strong></td>
                    <td data-label="Laikas">${t.lesson_order}</td>
                    <td data-label="Grupė">${t.group_display}</td>
                    <td data-label="Kabinetas">${t.classroom}</td>
                    <td data-label="Mokytojas">${t.teacher || '-'}</td>
                `;

                if (showActions) {
                    const actionsTd = isOwner 
                        ? `<a href="javascript:void(0);" onclick="deleteTimetableEntry(${t.timetable_id}); return false;">Ištrinti</a>`
                        : '<span style="color: #8a8d91;">Neturite teisių</span>';
                    
                    rowHtml += `<td data-label="Veiksmai">${actionsTd}</td>`;
                }

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function filterTimetable() {
            const filterDay = document.getElementById('filter_day').value;
            const searchText = document.getElementById('filter_search').value.toLowerCase().trim();

            const filtered = allTimetableEntries.filter(t => {
                let match = true;
                if (filterDay && t.day_of_week !== filterDay) match = false;
                if (searchText) {
                    const combined = `${t.day_of_week} ${t.lesson_order} ${t.group_display} ${t.classroom} ${t.teacher}`.toLowerCase();
                    if (!combined.includes(searchText)) match = false;
                }
                return match;
            });

            renderTimetable(filtered);
        }

        if (currentUser.role === 'teacher' || currentUser.role === 'administrator') {
            document.getElementById('addTimetableForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                const payload = {
                    group_id: formData.get('group_id'),
                    day_of_week: formData.get('day_of_week'),
                    lesson_order: formData.get('lesson_order'),
                    classroom: formData.get('classroom')
                };

                try {
                    const response = await fetch(`${API_URL}/api/timetable/add`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        this.reset();
                        showToast("Pamoka sėkmingai pridėta į tvarkaraštį!", "success");
                        loadTimetable();
                    } else {
                        const errResult = await response.json();
                        showToast(errResult.message || "Klaida pridedant pamoką.", "error");
                    }
                } catch (error) {
                    showToast("Nepavyko prisijungti prie serverio.", "error");
                }
            });
        }

        async function deleteTimetableEntry(id) {
            if (!confirm('Ar tikrai norite pašalinti šią pamoką iš tvarkaraščio?')) return;
            try {
                const response = await fetch(`${API_URL}/api/timetable/delete/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    showToast("Pamoka pašalinta.", "success");
                    loadTimetable();
                } else {
                    showToast("Klaida šalinant pamoką.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
