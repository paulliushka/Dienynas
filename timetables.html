<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pamokų tvarkaraštis ir valdymas</h1>

        <!-- Tvarkaraščio kūrimo forma (matoma mokytojams ir administratoriams) -->
        <div class="card" id="createTimetableCard" style="display: none;">
            <h2>Pridėti naują pamoką į tvarkaraštį</h2>
            <form id="addTimetableForm" onsubmit="handleSaveTimetable(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    <div class="form-group">
                        <label>Grupė</label>
                        <select id="groupSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Savaitės diena</label>
                        <select id="daySelect" required>
                            <option value="Pirmadienis">Pirmadienis</option>
                            <option value="Antradienis">Antradienis</option>
                            <option value="Trečiadienis">Trečiadienis</option>
                            <option value="Ketvirtadienis">Ketvirtadienis</option>
                            <option value="Penktadienis">Penktadienis</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pamokos eiliškumas / Laikas</label>
                        <input type="text" id="lessonOrder" placeholder="pvz. 1 pamoka" required>
                    </div>
                    <div class="form-group">
                        <label>Kabinetas</label>
                        <input type="text" id="classroom" placeholder="pvz. 214 kab.">
                    </div>
                    <div class="form-group">
                        <label>Mokytojas (Pavadavimui)</label>
                        <select id="teacherSelect" required></select>
                    </div>
                    <div class="form-group">
                        <label>Galioja nuo (Data)</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label>Galioja iki (Data)</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 12px;">Pridėti į tvarkaraštį</button>
            </form>
        </div>

        <!-- Savaitės dienų ir pamokų eiliškumo vaizdas -->
        <div class="card">
            <h2>Esamos savaitės pamokos</h2>
            <div id="timetableContainer"></div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let userRole = '';

        async function init() {
            try {
                const resProfile = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!resProfile.ok) { window.location.href = '/'; return; }
                const user = await resProfile.json();
                userRole = user.role;

                if (user.role === 'teacher' || user.role === 'administrator') {
                    document.getElementById('createTimetableCard').style.display = 'block';
                    await loadFormDropdowns();
                }

                await loadTimetables();
            } catch (err) {
                showToast('Nepavyko užkrauti tvarkaraščio.', 'error');
            }
        }

        async function loadFormDropdowns() {
            try {
                const [resGroups, resTeachers] = await Promise.all([
                    fetch(`${API_URL}/api/groups`, { credentials: 'include' }),
                    fetch(`${API_URL}/api/teachers`, { credentials: 'include' })
                ]);
                const groups = await resGroups.json();
                const teachers = await resTeachers.json();

                const gSelect = document.getElementById('groupSelect');
                gSelect.innerHTML = '';
                groups.forEach(g => {
                    gSelect.innerHTML += `<option value="${g.group_id}">${g.group_name} (${g.class})</option>`;
                });

                const tSelect = document.getElementById('teacherSelect');
                tSelect.innerHTML = '';
                teachers.forEach(t => {
                    tSelect.innerHTML += `<option value="${t.user_id}">${t.name} ${t.surname}</option>`;
                });
            } catch (err) {
                showToast('Klaida užkraunant grupes ar mokytojus.', 'error');
            }
        }

        async function loadTimetables() {
            try {
                const resTt = await fetch(`${API_URL}/api/timetables`, { credentials: 'include' });
                const timetables = await resTt.json();
                renderTimetableByDays(timetables);
            } catch (err) {
                showToast('Klaida užkraunant įrašus.', 'error');
            }
        }

        async function handleSaveTimetable(e) {
            e.preventDefault();
            const data = {
                group_id: document.getElementById('groupSelect').value,
                day_of_week: document.getElementById('daySelect').value,
                lesson_order: document.getElementById('lessonOrder').value,
                classroom: document.getElementById('classroom').value,
                teacher_id: document.getElementById('teacherSelect').value,
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value
            };

            try {
                const res = await fetch(`${API_URL}/api/timetables/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    showToast('Tvarkaraščio įrašas sėkmingai sukurtas!', 'success');
                    document.getElementById('addTimetableForm').reset();
                    await loadTimetables();
                } else {
                    showToast('Klaida išsaugant įrašą.', 'error');
                }
            } catch (err) {
                showToast('Tinklo klaida.', 'error');
            }
        }

        function renderTimetableByDays(timetables) {
            const container = document.getElementById('timetableContainer');
            container.innerHTML = '';

            const days = ['Pirmadienis', 'Antradienis', 'Trečiadienis', 'Ketvirtadienis', 'Penktadienis'];

            days.forEach(day => {
                const dayItems = timetables.filter(t => t.day_of_week === day);
                dayItems.sort((a, b) => (a.lesson_order || '').localeCompare(b.lesson_order || ''));

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-section';
                dayDiv.innerHTML = `<div class="day-title">${day}</div>`;

                if (dayItems.length === 0) {
                    dayDiv.innerHTML += `<div style="color: var(--text-muted); font-style: italic; padding: 6px 0;">Šią dieną pamokų nėra.</div>`;
                } else {
                    const listDiv = document.createElement('div');
                    listDiv.className = 'lesson-grid-list';

                    dayItems.forEach(t => {
                        const card = document.createElement('div');
                        card.className = 'lesson-item-card';
                        
                        // Jei mokytojas arba admin - leidžiame paspausti ir redaguoti atskirame edit_timetable.html puslapyje
                        if (userRole === 'teacher' || userRole === 'administrator') {
                            card.style.cursor = 'pointer';
                            card.title = 'Spauskite norėdami redaguoti';
                            card.onclick = () => {
                                window.location.href = `edit_timetable?timetable_id=${t.timetable_id}`;
                            };
                        }

                        card.innerHTML = `
                            <strong>${t.group_display}</strong><br>
                            <span style="color: var(--accent-blue);">Pamoka: ${t.lesson_order}</span><br>
                            <span style="color: var(--text-secondary);">Kabinetas: ${t.classroom || '-'}</span><br>
                            <span style="color: var(--text-muted);">Mokytojas: ${t.teacher || '-'}</span><br>
                            ${t.start_date ? `<small style="color:var(--text-muted);">Galioja: ${t.start_date} iki${t.end_date || 'neribotai'}</small>` : ''}
                        `;
                        listDiv.appendChild(card);
                    });
                    dayDiv.appendChild(listDiv);
                }
                container.appendChild(dayDiv);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
