<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Namų darbai</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <h1>Namų darbai</h1>

        <!-- Kūrimo forma (Mokytojui / Adminui) -->
        <div class="card" id="addHomeworkCard" style="display: none;">
            <h2>Paskirti naują namų darbą</h2>
            <form id="addHomeworkForm">
                <label>Grupė / Dalykas</label>
                <select name="subject_id" id="subject_select" required>
                    <option value="">-- Pasirinkite grupę --</option>
                </select>

                <label>Užduoties aprašymas</label>
                <textarea name="task" rows="3" placeholder="Pvz., Atlikti 12-15 užduotis 45 puslapyje..." style="width: 100%; padding: 8px; box-sizing: border-box;" required></textarea>

                <label>Atlikimo termiškas (Data)</label>
                <input type="date" name="due_date" id="due_date" required>

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Paskirti namų darbą</button>
            </form>
        </div>

        <!-- Namų darbų sąrašas -->
        <div class="card">
            <h2>Esami namų darbai</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Dalykas</th>
                            <th>Užduotis</th>
                            <th>Atlikti iki</th>
                            <th>Mokytojas</th>
                            <th>Veiksmai</th>
                        </tr>
                    </thead>
                    <tbody id="homeworkTableBody">
                        <!-- Duomenys kraunami dinamiškai -->
                    </tbody>
                </table>
            </div>
        </div>

        <a href="dashboard.html" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');

        if (!currentUser.user_id) {
            window.location.href = 'index.html';
        }

        async function initPage() {
            // Rodyti formą tik mokytojams arba adminams
            if (currentUser.role === 'teacher' || currentUser.role === 'administrator') {
                document.getElementById('addHomeworkCard').style.display = 'block';
                loadTeacherGroups();
            }

            loadHomework();
        }

        // Užkrauna mokytojo grupes pasirinkimui
        async function loadTeacherGroups() {
            try {
                const response = await fetch(`${API_URL}/api/groups?user_id=${currentUser.user_id}&role=${currentUser.role}`);
                const groups = await response.json();

                const select = document.getElementById('subject_select');
                select.innerHTML = '<option value="">-- Pasirinkite grupę --</option>';

                groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.subject_id;
                    opt.textContent = `${g.subject} (${g.class} klasė)`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Klaida užkraunant grupes:", error);
            }
        }

        // Užkrauna namų darbus
        async function loadHomework() {
            try {
                const response = await fetch(`${API_URL}/api/homework?user_id=${currentUser.user_id}&role=${currentUser.role}`);
                const homeworks = await response.json();

                const tbody = document.getElementById('homeworkTableBody');
                tbody.innerHTML = '';

                if (homeworks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:gray;">Namų darbų nėra.</td></tr>';
                    return;
                }

                homeworks.forEach(hw => {
                    const tr = document.createElement('tr');

                    // Saugumo / teisių patikra
                    const isOwner = hw.teacher_id == currentUser.user_id || currentUser.role === 'administrator';

                    let actionsTd = '';
                    if (isOwner) {
                        actionsTd = `
                            <a href="edit_homework.html?id=${hw.homework_id}">Redaguoti</a> | 
                            <a href="#" onclick="deleteHomework(${hw.homework_id}); return false;">Ištrinti</a>
                        `;
                    } else {
                        actionsTd = '<span style="color: #bdc3c7;">Neturite teisių</span>';
                    }

                    tr.innerHTML = `
                        <td><strong>${hw.subject_display}</strong></td>
                        <td>${hw.task}</td>
                        <td>${hw.due_date}</td>
                        <td>${hw.teacher || '-'}</td>
                        <td>${actionsTd}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Klaida užkraunant namų darbus:", error);
            }
        }

        // Naujo namų darbo paskyrimas
        document.getElementById('addHomeworkForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const payload = {
                subject_id: formData.get('subject_id'),
                task: formData.get('task'),
                due_date: formData.get('due_date'),
                teacher_id: currentUser.user_id
            };

            try {
                const response = await fetch(`${API_URL}/api/homework/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    this.reset();
                    loadHomework();
                } else {
                    alert("Klaida pridedant namų darbą.");
                }
            } catch (error) {
                alert("Nepavyko prisijungti prie serverio.");
            }
        });

        // Namų darbo trynimas
        async function deleteHomework(homeworkId) {
            if (!confirm('Ar tikrai norite ištrinti šį namų darbą?')) return;

            try {
                const response = await fetch(`${API_URL}/api/homework/delete/${homeworkId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadHomework();
                } else {
                    alert("Klaida trinant namų darbą.");
                }
            } catch (error) {
                alert("Nepavyko prisijungti prie serverio.");
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
