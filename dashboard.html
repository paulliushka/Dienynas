<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pagrindinis</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <h1>Mokslus sistema</h1>
        <div class="card">
            <p id="welcomeUser" style="margin-bottom: 20px; font-weight: bold; font-size: 1.1em;"></p>
            
            <!-- Kortelių tinklelis su ikonėlėmis -->
            <div id="navGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;"></div>
            
            <button class="logout-btn" onclick="logout()" style="width: 100%;">Atsijungti</button>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const res = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!res.ok) { window.location.href = '/'; return; }
                const user = await res.json();

                document.getElementById('welcomeUser').textContent = `Prisijungęs: ${user.name} ${user.surname} (${user.role})`;
                const nav = document.getElementById('navGrid');
                nav.innerHTML = '';

                let links = [];

                if (user.role === 'administrator') {
                    // Administratorius mato tik vartotojų valdymą
                    links = [
                        { href: 'users', title: 'Vartotojų valdymas', icon: '👥' }
                    ];
                } else if (user.role === 'teacher') {
                    links = [
                        { href: 'timetables', title: 'Tvarkaraščiai', icon: '📅' },
                        { href: 'groups', title: 'Grupės', icon: '🏫' },
                        { href: 'lessons', title: 'Pamokų žurnalas', icon: '📖' },
                        { href: 'remarks', title: 'Pagyrimai ir pastabos', icon: '⭐' }
                    ];
                } else if (user.role === 'student') {
                    links = [
                        { href: 'timetables', title: 'Tvarkaraštis', icon: '📅' },
                        { href: 'grades', title: 'Pažymiai', icon: '📊' },
                        { href: 'assignments', title: 'Namų darbai', icon: '📝' },
                        { href: 'attendance', title: 'Lankomumas', icon: '📋' },
                        { href: 'remarks', title: 'Pagyrimai ir pastabos', icon: '⭐' }
                    ];
                }

                // Profilis prieinamas visiems
                links.push({ href: 'profile', title: 'Mano profilis', icon: '⚙️' });

                links.forEach(l => {
                    const card = document.createElement('a');
                    card.href = l.href;
                    card.className = 'btn btn-primary';
                    card.style.cssText = 'display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 10px; text-decoration: none; text-align: center; gap: 8px; font-size: 15px; border-radius: 8px;';
                    card.innerHTML = `<span style="font-size: 32px;">${l.icon}</span><span>${l.title}</span>`;
                    nav.appendChild(card);
                });

            } catch (err) {
                window.location.href = '/';
            }
        }

        async function logout() {
            await fetch(`${API_URL}/api/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = '/';
        }

        window.onload = init;
    </script>
</body>
</html>
