<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pagrindinis puslapis</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <div class="user-welcome">
                <h2 id="welcomeText">Sveiki</h2>
            </div>
            <div class="dashboard-right">
                <span id="roleBadge" class="badge-role"></span>
                <button class="logout-btn" onclick="logout()">Atsijungti</button>
            </div>
        </div>

        <div class="grid-container" id="menuGrid"></div>
    </div>

    <script>
        let currentUser = {};

        async function checkAuthAndLoad() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }
                currentUser = await response.json();

                document.getElementById('welcomeText').textContent = `Sveiki, ${currentUser.name} ${currentUser.surname}!`;
                
                let roleName = 'Vartotojas';
                if (currentUser.role === 'administrator') roleName = 'Administratorius';
                if (currentUser.role === 'teacher') roleName = 'Mokytojas';
                if (currentUser.role === 'student') {
                    roleName = 'Mokinys';
                    if (currentUser.class) roleName += ` (${currentUser.class} klasė)`;
                }
                document.getElementById('roleBadge').textContent = roleName;

                const grid = document.getElementById('menuGrid');
                // Pažymiai ir namų darbai matomi tik mokiniams (mokytojai juos valdo per Pamokas)
                const menuItems = [
                    { href: 'lessons', icon: '📖', title: 'Pamokos', desc: 'Pamokų žurnalas, lankomumas, pažymiai ir užduotys.', roles: ['teacher', 'administrator'] },
                    { href: 'grades', icon: '📊', title: 'Pažymiai', desc: 'Peržiūrėkite savo pažymius.', roles: ['student'] },
                    { href: 'assignments', icon: '📝', title: 'Namų darbai', desc: 'Užduotys ir namų darbai.', roles: ['student'] },
                    { href: 'timetables', icon: '📅', title: 'Tvarkaraštis', desc: 'Pamokų tvarkaraščiai ir kabinetai.', roles: ['administrator', 'teacher', 'student'] },
                    { href: 'attendance', icon: '📋', title: 'Lankomumas', desc: 'Pamokų lankomumo stebėjimas.', roles: ['administrator', 'teacher', 'student'] },
                    { href: 'remarks', icon: '⭐', title: 'Pagyrimai ir pastabos', desc: 'Mokinių pasiekimai bei pastabos.', roles: ['administrator', 'teacher', 'student'] },
                    { href: 'groups', icon: '👥', title: 'Grupės', desc: 'Mokinių grupės ir jų valdymas.', roles: ['administrator', 'teacher'] },
                    { href: 'users', icon: '⚙️', title: 'Vartotojai', desc: 'Sukurkite ir valdykite sistemos vartotojus.', roles: ['administrator'] },
                    { href: 'profile', icon: '👤', title: 'Profilis', desc: 'Redakuokite paskyros duomenis ir slaptažodį.', roles: ['administrator', 'teacher', 'student'] }
                ];

                menuItems.forEach(item => {
                    if (item.roles.includes(currentUser.role)) {
                        const card = document.createElement('a');
                        card.href = item.href;
                        card.className = 'nav-card';
                        card.innerHTML = `
                            <div>
                                <div class="nav-card-icon">${item.icon}</div>
                                <h3>${item.title}</h3>
                                <p>${item.desc}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function logout() {
            try {
                await fetch(`${API_URL}/api/logout`, { method: 'POST', credentials: 'include' });
                window.location.href = '/';
            } catch (err) {
                showToast("Klaida atsijungiant.", "error");
            }
        }

        window.onload = checkAuthAndLoad;
    </script>
</body>
</html>
