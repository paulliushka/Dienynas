<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Pagrindinis puslapis</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
            <div class="user-welcome">
                <h2 id="welcomeText">Sveiki</h2>
                <p><span id="roleBadge" class="badge-role"></span></p>
            </div>
            <button class="logout-btn" onclick="logout()">Atsijungti</button>
        </div>

        <div class="grid-container" id="menuGrid">
            <!-- Dinamiškai užsikraus pagal rolę -->
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        if (!currentUser.user_id) { window.location.href = '/'; }

        document.getElementById('welcomeText').textContent = `Sveiki, ${currentUser.name} ${currentUser.surname}!`;
        
        let roleName = 'Vartotojas';
        if (currentUser.role === 'administrator') roleName = 'Administratorius';
        if (currentUser.role === 'teacher') roleName = 'Mokytojas';
        if (currentUser.role === 'student') roleName = 'Mokinys';
        document.getElementById('roleBadge').textContent = roleName;

        const grid = document.getElementById('menuGrid');

        const menuItems = [
            { href: 'profile', icon: '👤', title: 'Profilis', desc: 'Redakuokite paskyros duomenis ir slaptažodį.', roles: ['administrator', 'teacher', 'student'] },
            { href: 'grades', icon: '📊', title: 'Pažymiai', desc: 'Peržiūrėkite arba rašykite pažymius.', roles: ['administrator', 'teacher', 'student'] },
            { href: 'assignments', icon: '📝', title: 'Namų darbai', desc: 'Užduotys ir namų darbai mokiniams.', roles: ['administrator', 'teacher', 'student'] },
            { href: 'timetables', icon: '📅', title: 'Tvarkaraštis', desc: 'Pamokų tvarkaraščiai ir kabinetai.', roles: ['administrator', 'teacher', 'student'] },
            { href: 'attendance', icon: '📋', title: 'Lankomumas', desc: 'Pamokų lankomumo stebėjimas ir žymėjimas.', roles: ['administrator', 'teacher', 'student'] },
            { href: 'remarks', icon: '⭐', title: 'Pagyrimai ir pastabos', desc: 'Mokinių pasiekimai bei pastabos.', roles: ['administrator', 'teacher', 'student'] },
            { href: 'groups', icon: '👥', title: 'Grupės', desc: 'Mokinių grupės ir jų valdymas.', roles: ['administrator', 'teacher'] },
            { href: 'administration', icon: '⚙️', title: 'Vartotojų valdymas', desc: 'Sukurkite ir valdykite sistemos vartotojus.', roles: ['administrator'] }
        ];

        menuItems.forEach(item => {
            if (item.roles.includes(currentUser.role)) {
                const card = document.createElement('a');
                card.href = item.href;
                card.className = 'nav-card';
                card.innerHTML = `
                    <div>
                        <div class="nav-card-icon">${item.icon}</div>
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            }
        });

        async function logout() {
            try {
                await fetch(`${API_URL}/api/logout`, { method: 'POST', credentials: 'include' });
                localStorage.removeItem('user');
                window.location.href = '/';
            } catch (err) {
                showToast("Klaida atsijungiant.", "error");
            }
        }
    </script>
</body>
</html>
