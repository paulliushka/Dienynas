<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Dienynas</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Dienynas</h1>
            
            <span class="user-info">
                Prisijungęs vartotojas: <strong id="userName">Kraunama...</strong>
            </span>

            <hr>

            <h3>Meniu pasirinkimai:</h3>
            <ul class="menu-list" id="menuList"></ul>

            <button onclick="logout()" class="btn btn-logout" style="border: none; cursor: pointer;">Atsijungti iš sistemos</button>
        </div>
    </div>

    <script>
        const userJson = localStorage.getItem('user');
        if (!userJson) {
            window.location.href = '/';
        }

        const user = JSON.parse(userJson);
        document.getElementById('userName').textContent = `${user.name} ${user.surname}`;

        const menuList = document.getElementById('menuList');
        menuList.innerHTML = '';

        menuList.innerHTML += `
            <li><a href="grades">📊 Pažymiai ir vertinimai</a></li>
            <li><a href="assignments">📚 Užduotys</a></li>
        `;

        if (user.role === 'teacher' || user.role === 'administrator') {
            menuList.innerHTML += `
                <li><a href="groups">👥 Grupių valdymas</a></li>
            `;
        }

        if (user.role === 'administrator') {
            menuList.innerHTML += `
                <li><a href="administration">⚙️ Vartotojų kūrimas ir valdymas</a></li>
            `;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }
    </script>
</body>
</html>
