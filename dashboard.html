<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Pagrindinis</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="toast.js"></script>
</head>
<body>
    <div class="container">
        <!-- Viršutinė stilinga juosta pagal tavo styles.css -->
        <div class="dashboard-header">
            <div class="user-welcome">
                <h2 id="welcomeTitle">Mokslus sistema</h2>
            </div>
            <div class="dashboard-right">
                <span id="roleBadge" class="badge-role"></span>
                <a href="javascript:void(0);" onclick="logout()" class="logout-btn">Atsijungti</a>
            </div>
        </div>

        <!-- Kortelių tinklelis pagal tavo .grid-container ir .nav-card klases -->
        <div id="navGrid" class="grid-container"></div>
    </div>

    <script>
        async function init() {
            try {
                const res = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!res.ok) { window.location.href = '/'; return; }
                const user = await res.json();

                document.getElementById('welcomeTitle').textContent = `Sveikas, ${user.name} ${user.surname}`;
                document.getElementById('roleBadge').textContent = user.role;

                const grid = document.getElementById('navGrid');
                grid.innerHTML = '';

                let links = [];

                if (user.role === 'administrator') {
                    // Administratorius mato tik vartotojų valdymą
                    links = [
                        { href: 'users', title: 'Vartotojų valdymas', desc: 'Kurkite naujus vartotojus ir generuokite registracijos kodus.', icon: '👥' }
                    ];
                } else if (user.role === 'teacher') {
                    links = [
                        { href: 'timetables', title: 'Tvarkaraščiai', desc: 'Pamokų eiliškumas, kabinetai ir mokytojų pavadavimai.', icon: '📅' },
                        { href: 'groups', title: 'Grupės', desc: 'Mokinių ir mokytojų grupių valdymas bei sąrašai.', icon: '🏫' },
                        { href: 'lessons', title: 'Pamokų žurnalas', desc: 'Klasės darbai, namų darbai, lankomumas ir pažymiai.', icon: '📖' },
                        { href: 'remarks', title: 'Pagyrimai ir pastabos', desc: 'Mokinių drausmės įrašai, pastabos ir pagyrimai.', icon: '⭐' }
                    ];
                } else if (user.role === 'student') {
                    links = [
                        { href: 'timetables', title: 'Tvarkaraštis', desc: 'Jūsų savaitės pamokų tvarkaraštis ir kabinetai.', icon: '📅' },
                        { href: 'grades', title: 'Pažymiai', desc: 'Gauti įvertinimai, kontroliniai darbai ir komentarai.', icon: '📊' },
                        { href: 'assignments', title: 'Namų darbai', desc: 'Aktyvios namų darbų užduotys ir jų atlikimo terminai.', icon: '📝' },
                        { href: 'attendance', title: 'Lankomumas', desc: 'Praleistos pamokos, vėlavimai ir lankomumo suvestinė.', icon: '📋' },
                        { href: 'remarks', title: 'Pagyrimai ir pastabos', desc: 'Mokytojų pastabos ir pagyrimai jums.', icon: '⭐' }
                    ];
                }

                // Profilis prieinamas visiems
                links.push({ href: 'profile', title: 'Mano profilis', desc: 'Tvarkykite savo paskyros duomenis ir slaptažodį.', icon: '⚙️' });

                links.forEach(l => {
                    const card = document.createElement('a');
                    card.href = l.href;
                    card.className = 'nav-card';
                    card.innerHTML = `
                        <div>
                            <div class="nav-card-icon">${l.icon}</div>
                            <h3>${l.title}</h3>
                            <p>${l.desc}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                window.location.href = '/';
            }
        }

        async function logout() {
            await fetch(`${API_URL}/api/logout`, { method: 'POST', credentials: 'include' });
            window.location.href = '/';
        }

        window.onload = init;
    </script>
</body>
</html>
