<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Vartotojai</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="static/styles/style.css">
    <link rel="manifest" href="static/pwa/manifest.json">
    <script src="static/js/calendar.js" defer></script>
    <script src="static/js/config.js" defer></script>
    <script src="static/js/select.js" defer></script>
    <script src="static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Vartotojai</h1>
        
        <div class="card">
            <h2>Sukurti naują vartotoją</h2>
            
            <div id="regCodeResult" class="info-panel d-none">
                <strong>Vartotojas sėkmingai sukurtas!</strong> Registracijos kodas: <span id="generatedCode" style="font-family: monospace; font-weight: bold;"></span>
            </div>

            <form id="addUserForm">
                <label>Vardas</label>
                <input type="text" name="name" placeholder="Vardas" required>
                
                <label>Pavardė</label>
                <input type="text" name="surname" placeholder="Pavardė" required>
                
                <label>Rolė</label>
                <select name="role" id="roleSelect" required onchange="toggleClassField()">
                    <option value="student">Mokinys</option>
                    <option value="teacher">Mokytojas</option>
                    <option value="administrator">Administratorius</option>
                </select>
                
                <label>Klasė (tik mokiniams)</label>
                <input type="text" name="class" placeholder="Klasė" id="class" required>
                
                <button type="submit" class="btn btn-primary mt-15">Sukurti</button>
            </form>
        </div>

        <div class="card">
            <h2>Esami vartotojai</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Vartotojo vardas</th>
                            <th>Registracijos kodas</th>
                            <th>Vardas Pavardė</th>
                            <th>Rolė</th>
                            <th>Klasė</th>
                            <th>Veiksmai</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>

        <a href="dashboard" class="btn-back">← Grįžti į pagrindinį</a>
    </div>

    <script>
        let currentUser = {};

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();
                if (currentUser.role !== 'administrator') {
                    showToast('Puslapis pasiekiamas tik administratoriams.', 'error');
                    window.location.href = 'dashboard';
                    return;
                }
                toggleClassField();
                await loadUsers();
                if (typeof initCustomSelects === 'function') initCustomSelects();
            } catch (err) {
                window.location.href = '/';
            }
        }

        function toggleClassField() {
            const role = document.getElementById('roleSelect').value;
            const classField = document.getElementById('class');
            if (role === 'student') {
                classField.disabled = false;
                classField.required = true;
            } else {
                classField.disabled = true;
                classField.required = false;
                classField.value = "";
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/api/users`, { credentials: 'include' });
                if (response.status === 401) { window.location.href = '/'; return; }
                const users = await response.json();

                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                const roleTranslations = {
                    'student': 'Mokinys',
                    'teacher': 'Mokytojas',
                    'administrator': 'Administratorius'
                };

                users.forEach(u => {
                    const isPending = u.status === 'pending';
                    const usernameDisplay = u.username ? u.username : '-';
                    
                    let regCodeDisplay = '-';
                    if (u.reg_code) {
                        const codeClass = isPending ? 'reg-code-unused' : 'reg-code-used';
                        regCodeDisplay = `<span class="${codeClass}">${u.reg_code}</span>`;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td data-label="Vartotojo vardas">${usernameDisplay}</td>
                        <td data-label="Reg. kodas">${regCodeDisplay}</td>
                        <td data-label="Vardas Pavardė"><strong>${u.name} ${u.surname}</strong></td>
                        <td data-label="Rolė">${roleTranslations[u.role] || u.role}</td>
                        <td data-label="Klasė">${u.class ? u.class : '-'}</td>
                        <td data-label="Veiksmai">
                            <a href="editing/edit_user?id=${u.user_id}">Redaguoti</a> | 
                            <a href="javascript:void(0);" onclick="deleteUser(${u.user_id}); return false;">Ištrinti</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                showToast("Nepavyko užkrauti vartotojų.", "error");
            }
        }

        document.getElementById('addUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`${API_URL}/api/users/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    this.reset();
                    
                    const roleSelect = document.getElementById('roleSelect');
                    roleSelect.dispatchEvent(new Event('change', { bubbles: true }));

                    toggleClassField();
                    loadUsers();

                    const resultBox = document.getElementById('regCodeResult');
                    if (result.reg_code) {
                        document.getElementById('generatedCode').textContent = result.reg_code;
                        resultBox.classList.remove('d-none');
                    } else {
                        resultBox.classList.add('d-none');
                    }
                    showToast("Vartotojas sėkmingai sukurtas!", "success");
                } else {
                    showToast(result.message || "Nepavyko sukurti vartotojo.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        });

        async function deleteUser(userId) {
            if (!confirm('Ar tikrai norite ištrinti šį vartotoją?')) return;

            try {
                const response = await fetch(`${API_URL}/api/users/delete/${userId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok) {
                    showToast("Vartotojas ištrintas.", "success");
                    loadUsers();
                } else {
                    showToast("Nepavyko ištrinti.", "error");
                }
            } catch (error) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        }

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
