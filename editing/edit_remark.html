<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Mokslus - Redaguoti pastabą</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../static/images/apple-touch-icon.png">
    <link rel="stylesheet" href="../static/styles/style.css">
    <link rel="manifest" href="../static/pwa/manifest.json">
    <script src="../static/js/calendar.js" defer></script>
    <script src="../static/js/config.js" defer></script>
    <script src="../static/js/select.js" defer></script>
    <script src="../static/js/toast.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pagyrimai ir pastabos</h1>
        <div class="card">
            <h2>Redaguoti pagyrimo arba pastabos įrašą</h2>
            <form id="editRemarkForm">
                <label>Grupė</label>
                <input type="text" id="group_name" disabled class="readonly-input">
                
                <label>Mokinys</label>
                <input type="text" id="student" disabled class="readonly-input">
                
                <label>Tipas</label>
                <select name="type" id="type" required>
                    <option value="praise">Pagyrimas</option>
                    <option value="reprimand">Pastaba</option>
                </select>
                
                <label>Turinys</label>
                <textarea name="content" id="content" rows="3" required></textarea>

                <label>Data</label>
                <input type="date" name="date" id="date" required>
                
                <button type="submit" class="btn btn-primary mt-15">Išsaugoti</button>
            </form>
            <br>
            <a href="../remarks" class="btn-back">← Grįžti atgal</a>
        </div>
    </div>

    <script>
        let currentUser = {};
        const urlParams = new URLSearchParams(window.location.search);
        const remarkId = urlParams.get('id');
        if (!remarkId) { window.location.href = '../remarks'; }

        async function checkAuthAndInit() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { credentials: 'include' });
                if (!response.ok) { window.location.href = '/'; return; }
                currentUser = await response.json();
                if (currentUser.role !== 'teacher') {
                    window.location.href = '../dashboard';
                    return;
                }
                await loadRemark();
            } catch (err) {
                window.location.href = '/';
            }
        }

        async function loadRemark() {
            try {
                const response = await fetch(`${API_URL}/api/remarks`, { credentials: 'include' });
                const remarks = await response.json();
                const item = remarks.find(r => r.remark_id == remarkId);
                
                if (!item) { window.location.href = '../remarks'; return; }

                document.getElementById('group_name').value = item.group_display || '';
                document.getElementById('student').value = item.student || '';
                document.getElementById('content').value = item.content || '';

                const typeSelect = document.getElementById('type');
                typeSelect.value = item.type || 'praise';
                typeSelect.dispatchEvent(new Event('change', { bubbles: true }));

                const dateInput = document.getElementById('date');
                dateInput.value = item.date || '';
                dateInput.dispatchEvent(new Event('change', { bubbles: true }));

                if (typeof initCalendarPickers === 'function') initCalendarPickers();
                if (typeof initCustomSelects === 'function') initCustomSelects();
            } catch (error) { 
                showToast("Nepavyko užkrauti įrašo duomenų.", "error");
            }
        }

        document.getElementById('editRemarkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this).entries());
            try {
                const res = await fetch(`${API_URL}/api/remarks/edit/${remarkId}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    credentials: 'include', 
                    body: JSON.stringify(data)
                });

                if (res.ok) { 
                    window.location.href = '../remarks'; 
                } else { 
                    const r = await res.json();
                    showToast(r.message || "Nepavyko išsaugoti įrašo.", "error"); 
                }
            } catch (err) {
                showToast("Nepavyko prisijungti prie serverio.", "error");
            }
        });

        window.onload = checkAuthAndInit;
    </script>
</body>
</html>
