<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Redaguoti pažymį</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        if (!currentUser.user_id || currentUser.role !== 'teacher') { window.location.href = 'dashboard'; }
    </script>
    <div class="container">
        <div class="card">
            <h2>Redaguoti pažymį</h2>
            <form id="editGradeForm">
                <label>Grupė:</label>
                <input type="text" id="group_name" disabled>
                
                <label>Mokinys:</label>
                <input type="text" id="student" disabled>
                
                <label>Pažymys:</label>
                <input type="text" name="grade" id="grade" required>
                
                <label>Tipas:</label>
                <select name="type" id="type" required>
                    <option value="Savarankiškas darbas">Savarankiškas darbas</option>
                    <option value="Kontrolinis darbas">Kontrolinis darbas</option>
                    <option value="Projektinis darbas">Projektinis darbas</option>
                    <option value="Klasės darbas">Klasės darbas</option>
                    <option value="Namų darbas">Namų darbas</option>
                    <option value="Kaupiamasis">Kaupiamasis</option>
                </select>
                
                <label>Data:</label>
                <input type="date" name="date" id="date" required>
                
                <label>Komentaras:</label>
                <input type="text" name="comment" id="comment">
                
                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Išsaugoti pakeitimus</button>
            </form>
            <br>
            <a href="grades" class="btn-back">Grįžti atgal</a>
        </div>
    </div>
    <script src="calendar.js"></script>
    <script src="select.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gradeId = urlParams.get('id');
        if (!gradeId) { window.location.href = 'grades'; }

        async function loadGrade() {
            try {
                const response = await fetch(`${API_URL}/api/grades`, { credentials: 'include' });
                const grades = await response.json();
                const item = grades.find(g => g.grade_id == gradeId);
                if (!item) { window.location.href = 'grades'; return; }
                document.getElementById('group_name').value = item.group_display || '';
                document.getElementById('student').value = item.student || '';
                document.getElementById('grade').value = item.grade || '';
                document.getElementById('type').value = item.type || 'Savarankiškas darbas';
                document.getElementById('date').value = item.date || '';
                document.getElementById('comment').value = item.comment || '';
                initCalendarPickers();
                initCustomSelects();
            } catch (error) { console.error(error); }
        }

        document.getElementById('editGradeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this).entries());
            const res = await fetch(`${API_URL}/api/grades/edit/${gradeId}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(data)
            });
            if (res.ok) { window.location.href = 'grades'; } else { alert("Klaida."); }
        });
        window.onload = loadGrade;
    </script>
</body>
</html>
