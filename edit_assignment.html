<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Redaguoti namų darbą</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
</head>
<body>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
        if (!currentUser.user_id || currentUser.role !== 'teacher') { 
            window.location.href = 'dashboard'; 
        }
    </script>
    <div class="container">
        <h1>Namų darbai</h1>

        <div class="card">
            <h2>Redaguoti namų darbą</h2>

            <div id="errorBox" class="error-message"></div>

            <form id="editAssignmentForm">
                <label>Grupė</label>
                <input type="text" id="group_name" disabled class="readonly-input">
                
                <label>Užduoties aprašymas</label>
                <input type="text" name="task" id="task" required>
                
                <label>Atlikti iki</label>
                <input type="date" name="due_date" id="due_date" required>
                
                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Išsaugoti pakeitimus</button>
            </form>
            <br>
            <a href="assignments" class="btn-back">← Grįžti atgal</a>
        </div>
    </div>

    <script src="calendar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const assignmentId = urlParams.get('id');
        if (!assignmentId) { window.location.href = 'assignments'; }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            if (box) {
                box.textContent = msg;
                box.style.display = 'block';
            }
        }

        async function loadAssignment() {
            try {
                const response = await fetch(`${API_URL}/api/assignments`, { credentials: 'include' });
                const assignments = await response.json();
                const item = assignments.find(a => a.assignment_id == assignmentId);
                
                if (!item) { window.location.href = 'assignments'; return; }

                document.getElementById('group_name').value = item.group_display || '';
                document.getElementById('task').value = item.task || '';

                const dueDateInput = document.getElementById('due_date');
                dueDateInput.value = item.due_date || '';
                dueDateInput.dispatchEvent(new Event('change', { bubbles: true }));
                
                initCalendarPickers();
            } catch (error) { 
                showError("Klaida kraunant užduoties duomenis.");
            }
        }

        document.getElementById('editAssignmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('errorBox').style.display = 'none';

            const data = Object.fromEntries(new FormData(this).entries());
            try {
                const res = await fetch(`${API_URL}/api/assignments/edit/${assignmentId}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    credentials: 'include', 
                    body: JSON.stringify(data)
                });

                if (res.ok) { 
                    window.location.href = 'assignments'; 
                } else { 
                    const r = await res.json();
                    showError(r.message || "Klaida išsaugant namų darbą."); 
                }
            } catch (err) {
                showError("Nepavyko prisijungti prie serverio.");
            }
        });

        window.onload = loadAssignment;
    </script>
</body>
</html>
